name: ine_population
description: INE municipal register (padrón continuo) - population of each municipality of Mallorca on 1 January, by sex, no API key
entrypoint: connectors.ine_population.extractor:InePopulationConnector
enabled: true
frequency: 1y          # one value per year, stamped on 1 January (local midnight), the reference date of the register
# Every run re-reads the last three years: the figures of a year are revised once after their first release.
min_days: 1095
max_days: 11500        # backfills: the table goes back to 1996 (there is no 1997 register)
# The figures on 1 January of a year are published around mid-December of that same year. Windows end 350 days
# before yesterday, so the latest year in a window is normally out.
lag_days: 350
secrets: []

options:
  base_url: https://servicios.ine.es/wstempus/js/ES
  timezone: Europe/Madrid
  # Values of the "Sexo" dimension of the table and the metric each one feeds.
  sexes: {"0": population, "1": population_men, "2": population_women}
  # INE code, name and centre of every municipality of Mallorca (from the IGN boundaries of the seed
  # dim_municipalities). A municipality is kept when its centre is inside the region.
  municipalities:
