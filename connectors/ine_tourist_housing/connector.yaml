name: ine_tourist_housing
description: INE experimental statistic of tourist dwellings - dwellings, beds and beds per dwelling listed on the main holiday rental platforms in each municipality of Mallorca, twice a year, no API key
entrypoint: connectors.ine_tourist_housing.extractor:IneTouristHousingConnector
enabled: true
# The INE counts the listings of one reference month twice a year, and that month has moved: August 2020, then
# February and August until August 2024, then November 2024 and May and November since. With no fixed spacing
# the gaps rule would be wrong, so the dataset is irregular, like the earthquakes: no gaps rule, and a window
# without a new reference month is a valid, empty result.
frequency: event
# Every run re-reads the last three years: a reference month is published some six months later, and the INE
# revises the experimental series when it changes the method. The whole history (since August 2020) is one request.
min_days: 1095
max_days: 2600         # backfills: the series starts in August 2020
secrets: []

options:
  base_url: https://servicios.ine.es/wstempus/js/ES
  timezone: Europe/Madrid
  # Values of the "Concepto turístico" dimension of the table (INE value ids) and the metric each one feeds.
  concepts: {"382508": tourist_dwellings, "382510": tourist_beds, "382509": beds_per_dwelling}
  # INE code, name, centre (the same as ine_population, from the IGN boundaries of dim_municipalities) and the
  # INE value id of every municipality of Mallorca. The table covers all of Spain (44 MB for six years), so the
  # request filters it to these municipalities with one tv=19:<ine_id> per municipality (19 is "Municipios").
  municipalities:
    "07001": {name: "Alaró", lat: 39.7239, lon: 2.8019, ine_id: "5660"}
