name: sepe_unemployment
description: SEPE registered unemployment - people registered as unemployed in each municipality of Mallorca per month, by sex and age band and by economic sector, no API key
entrypoint: connectors.sepe_unemployment.extractor:SepeUnemploymentConnector
enabled: true
frequency: 1mo         # one value per calendar month (the last working day's register), stamped on its first day
# Every run re-reads the last four months: SEPE revises the latest months of the open data file after their first
# release, and a short window would ask only for a month that is not published yet.
min_days: 120
max_days: 3700         # backfills: one yearly file per year, the first one is 2006
# The month M is added to its year's file around the 11th-18th of M+1 (October 2026 on 11 November, December
# 2023 on 18 January), a week after SEPE's press release. Windows end 50 days before yesterday, so the latest month in
# a window has normally been added.
lag_days: 50
secrets: []

options:
  # One CSV per year with every municipality of Spain (~10 MB, latin1, `;`, a title line above the header).
  url: https://sede.sepe.gob.es/es/portaltrabaja/resources/sede/datos_abiertos/datos/Paro_por_municipios_{year}_csv.csv
  first_year: 2006
  encoding: latin-1
  timezone: Europe/Madrid
  # Bronze keeps the title, the header and the lines of this province (Illes Balears) for the months of the window,
  # with the SHA-256 of the whole file: a yearly backfill would otherwise store 200 MB for 1 % of the lines.
  province: "7"
  # Header (spaces trimmed) -> metric. The age bands are SEPE's: "25 -45" is 25 to 44 and ">=45" 45 and over.
  columns:
    total Paro Registrado: unemployed
    Paro hombre edad < 25: unemployed_men_under_25
    Paro hombre edad 25 -45: unemployed_men_25_44
    Paro hombre edad >=45: unemployed_men_45_plus
    Paro mujer edad < 25: unemployed_women_under_25
    Paro mujer edad 25 -45: unemployed_women_25_44
    Paro mujer edad >=45: unemployed_women_45_plus
    Paro Agricultura: unemployed_agriculture
    Paro Industria: unemployed_industry
    Paro Construcción: unemployed_construction
    Paro Servicios: unemployed_services
    Paro Sin empleo Anterior: unemployed_no_previous_job
  # INE code, name and centre of every municipality of Mallorca (the same as ine_population, from the IGN boundaries
  # of dim_municipalities). SEPE writes the code with 4 digits until 2018 (7040) and with 5 since 2019 (07040).
