datasets:
  municipalities:
    path: Paro_por_municipios   # one file per year, see options.url

# metric name -> dataset, canonical unit, valid range (values outside it are labelled suspect). Since 2022 SEPE
# publishes every count from 1 to 4 as "<5" (statistical secrecy; until 2021 the exact figure, zeros included):
# `suppressed_below` stores them as null, neither a missing value nor a gap. A zero is still published as 0.
metrics:
  unemployed:                 {dataset: municipalities, unit: people, min: 0, max: 60000, suppressed_below: 5}
  unemployed_men_under_25:    {dataset: municipalities, unit: people, min: 0, max: 10000, suppressed_below: 5}
  unemployed_men_25_44:       {dataset: municipalities, unit: people, min: 0, max: 20000, suppressed_below: 5}
  unemployed_men_45_plus:     {dataset: municipalities, unit: people, min: 0, max: 20000, suppressed_below: 5}
  unemployed_women_under_25:  {dataset: municipalities, unit: people, min: 0, max: 10000, suppressed_below: 5}
  unemployed_women_25_44:     {dataset: municipalities, unit: people, min: 0, max: 20000, suppressed_below: 5}
  unemployed_women_45_plus:   {dataset: municipalities, unit: people, min: 0, max: 20000, suppressed_below: 5}
  unemployed_agriculture:     {dataset: municipalities, unit: people, min: 0, max: 5000, suppressed_below: 5}
  unemployed_industry:        {dataset: municipalities, unit: people, min: 0, max: 10000, suppressed_below: 5}
  unemployed_construction:    {dataset: municipalities, unit: people, min: 0, max: 20000, suppressed_below: 5}
  unemployed_services:        {dataset: municipalities, unit: people, min: 0, max: 50000, suppressed_below: 5}
  unemployed_no_previous_job: {dataset: municipalities, unit: people, min: 0, max: 10000, suppressed_below: 5}
