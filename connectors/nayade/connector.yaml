datasets:
  # Two tables of the same page per bathing water: the samples (one row per sampling point and sampling day) and
  # the restrictions (one row per sampling point and restriction, from its opening to its closing day).
  bathing_waters: {}

# metric name -> dataset, canonical unit, valid range (values outside it are labelled suspect)
metrics:
  # Náyade gives most results as MPN (NMP) and some as CFU (UFC) per 100 ml; the Directive 2006/7/EC treats both
  # the same. 10 is the detection limit of the method, written as 10 when nothing is found.
  e_coli:          {dataset: bathing_waters, unit: cfu/100ml, min: 0, max: 100000}
  enterococci:     {dataset: bathing_waters, unit: cfu/100ml, min: 0, max: 100000}
  # 0 fit for bathing, 1 bathing not advised, 2 bathing temporarily banned (options.advice).
  bathing_advice:  {dataset: bathing_waters, unit: level, min: 0, max: 2}
  # Days from the opening of a restriction to its closing (null while it is still open), on its opening day.
  incident_days:   {dataset: bathing_waters, unit: days, min: 0, max: 200}
  incident_level:  {dataset: bathing_waters, unit: level, min: 1, max: 2}
