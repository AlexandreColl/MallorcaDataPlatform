name: nayade
description: Náyade (Ministerio de Sanidad) - E. coli and intestinal enterococci of every sample taken at the bathing waters of Mallorca during the season, the advice that came with it and the bathing restrictions, no API key
entrypoint: connectors.nayade.extractor:NayadeConnector
enabled: true
# Samples are taken about every two weeks from April to September and nothing at all in winter, so the dataset is
# irregular events: no gaps rule (the seven months without samples are not missing), and a window without a sample
# is a valid, empty result.
frequency: event
# Náyade only shows the last four seasons (the window the EU classification is computed on) and the whole of them
# comes in every answer, so every run re-reads the last 400 days: a sample keyed in late, or corrected, is picked up.
min_days: 400
max_days: 1500         # backfills: the oldest season Náyade still shows (2023 on 2026-11-28)
secrets: []

options:
  base_url: https://nayadeciudadano.sanidad.gob.es/Splayas/ciudadano
  timezone: Europe/Madrid
  # Náyade's ids of the Balearic Islands (codCCAA) and of their province (codProvincia).
  region_id: "4"
  province_id: "7"
  # Zone of the UTM coordinates of the sampling points (ETRS89, the same as WGS84 at map scale).
  utm_zone: 31
  # Advice that Náyade writes next to each sample, and the ordinal code it is stored as (bathing_advice).
  advice:
    "Zona Apta para el baño": 0
    "Recomendación de no baño": 1
    "Zona donde queda prohibido el baño temporalmente": 2
  # Municipalities of Mallorca: INE code (Náyade asks for it without the leading zero), name and centre (the same as
  # ine_population, from the IGN boundaries of dim_municipalities). The centre only decides whether the municipality
  # is in the region; every sampling point is then checked against the region with its own coordinates.
  municipalities:
    "07001": {name: "Alaró", lat: 39.7239, lon: 2.8019}
