name: Nuevo conector
description: Propuesta para añadir una fuente de datos
labels: ["connector"]
body:
  - type: input
    id: source
    attributes:
      label: Fuente
      placeholder: "REData - demanda eléctrica Baleares"
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: URL de la API / documentación
    validations: { required: true }
  - type: dropdown
    id: auth
    attributes:
      label: Autenticación
      options: ["Sin clave", "Clave gratuita", "Token OAuth", "Otra"]
    validations: { required: true }
  - type: textarea
    id: probe
    attributes:
      label: Prueba real
      description: Llamada de ejemplo, respuesta (resumida), frecuencia y cobertura en Mallorca
    validations: { required: true }
  - type: textarea
    id: metrics
    attributes:
      label: Métricas y unidades
