name: PR title

# Enforce gitmoji + Conventional Commits on PR titles (they become the squash-merge commit):
#   ✨ feat(connector): add REData
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Leading emoji, then type(scope): subject
          headerPattern: '^\S+ (\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
          scopes: |
            core
            connector
            airflow
            dbt
            grafana
            infra
            deps
            release
          requireScope: false

      - name: Title starts with an emoji
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          first_byte=$(printf '%s' "$TITLE" | head -c1 | od -An -tu1 | tr -d ' ')
          if (( first_byte < 128 )); then
            echo "PR title must start with a gitmoji, e.g. '✨ feat(connector): add REData'"
            exit 1
          fi
