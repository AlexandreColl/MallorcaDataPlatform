name: PR title

# Enforce Conventional Commits on PR titles (they become the squash-merge commit).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
          scopes: |
            core
            connector
            airflow
            dbt
            grafana
            infra
            deps
            release
          requireScope: false
