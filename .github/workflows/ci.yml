name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: scripts/ci/retry.sh pip install ruff==0.17.4
      - run: ruff check --no-fix --output-format=github .
      - run: ruff format --check .

  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform (mocked AWS)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0  # same version as the Makefile
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      # Providers (registry) and tflint plugins (GitHub releases) are cached, and every download is retried: a
      # 502/504 of a few minutes no longer fails the job. tflint runs in its image from ghcr.io, as `make tf-check`
      # does, instead of the setup action that downloads the binary from a GitHub release.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ~/.tflint.d/plugins
          key: terraform-${{ hashFiles('infra/terraform/.terraform.lock.hcl', 'infra/terraform/.tflint.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" ~/.tflint.d/plugins
      - run: terraform fmt -check -recursive
      - run: ../../scripts/ci/retry.sh terraform init -backend=false -input=false
      - run: terraform validate
      - run: ../../scripts/ci/retry.sh docker pull --quiet "$TFLINT_IMAGE"
      - name: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}  # plugin download without the anonymous rate limit
        run: >-
          ../../scripts/ci/retry.sh docker run --rm -v "$PWD:/data" -w /data -v "$HOME/.tflint.d/plugins:/plugins"
          -e TFLINT_PLUGIN_DIR=/plugins -e GITHUB_TOKEN "$TFLINT_IMAGE" --init
      - run: >-
          docker run --rm -v "$PWD:/data" -w /data -v "$HOME/.tflint.d/plugins:/plugins"
          -e TFLINT_PLUGIN_DIR=/plugins "$TFLINT_IMAGE" --recursive --format compact
      # The tests run against mock_provider "aws": no AWS account, credentials or cost, and nothing is applied.
      - run: terraform test

  test:
    name: Unit tests (PySpark)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The two Delta Lake jars of the image (DELTA_VERSION in docker/airflow/Dockerfile), for the test SparkSession.
      # Spark's own download (Ivy) is refused by Maven Central from the runners.
      - name: Delta Lake jars
        run: |
          version=$(sed -n 's/^ARG DELTA_VERSION=//p' docker/airflow/Dockerfile)
          mkdir -p ~/spark-jars
          get="curl -fsSL --retry 5 --retry-all-errors --retry-delay 10"
          $get -o ~/spark-jars/delta-spark.jar \
            "https://repo1.maven.org/maven2/io/delta/delta-spark_4.2_2.13/${version}/delta-spark_4.2_2.13-${version}.jar"
          $get -o ~/spark-jars/delta-storage.jar \
            "https://repo1.maven.org/maven2/io/delta/delta-storage/${version}/delta-storage-${version}.jar"
          echo "SPARK_EXTRA_JARS=$HOME/spark-jars/delta-spark.jar,$HOME/spark-jars/delta-storage.jar" >> "$GITHUB_ENV"
      - run: scripts/ci/retry.sh pip install -r requirements/dev.txt
      - run: pytest --cov=core --cov=connectors --cov=api --cov-report=term-missing --cov-report=xml
      # The core (the platform without the source-specific connectors) keeps at least 80 % coverage, branches
      # included. dbt-docs.yml publishes the report and the README badge from this artifact.
      - name: Coverage of core
        run: |
          coverage report --include="core/*" --fail-under=80
          coverage json --include="core/*" -o coverage-core.json
          coverage html -d htmlcov --title "Mallorca Data Platform - coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-core.json
            htmlcov/

  dbt:
    name: dbt build (empty warehouse)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read  # download the develop manifest for slim CI
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      PGPASSWORD: warehouse
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dbt.txt
      # dbt-core's parser is an sdist whose build downloads a wheel from a GitHub release: the pip cache keeps the
      # built wheel, and the retry covers a cold cache during a GitHub outage.
      - run: scripts/ci/retry.sh pip install -r requirements/dbt.txt
      - name: Apply warehouse DDL
        run: psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f core/sql/warehouse.sql
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      - name: sqlfluff
        working-directory: dbt
        run: sqlfluff lint models --format github-annotation-native
      # Slim CI: a pull request only builds what it changed (state:modified) plus its children, compared with the
      # manifest of develop published by dbt-docs.yml. The warehouse is empty, so `@` also builds every parent of
      # those children: a test of a child (a relationship to another model) needs all of its parents to exist.
      # Without that manifest (first run, expired artifact) or outside pull requests, everything is built.
      - name: Manifest of develop (slim CI)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dbt-docs.yml --branch develop --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)  # no workflow run yet: full build
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name dbt-manifest --dir dbt/state; then
            # cautious: a test runs only when every model it reads was built (a relationships test against a model
            # outside the selection would query a table that does not exist on the empty warehouse).
            echo "DBT_SELECTION=--select @state:modified --state state --indirect-selection cautious" >> "$GITHUB_ENV"
            echo "Slim CI against develop (run $run_id)"
          else
            echo "No manifest of develop: full build"
          fi
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir . $DBT_SELECTION
      # A second build takes the incremental path (is_incremental), so its SQL is compiled and run too.
      - name: dbt build (incremental run)
        working-directory: dbt
        run: dbt build --profiles-dir . $DBT_SELECTION
      # The REST API runs every query against the marts just built (empty, but with their contracted columns).
      # Slim CI may have built nothing the API reads: build the lineage of its exposure first.
      - name: REST API against the warehouse
        env:
          API_INTEGRATION: "1"
          API_DB_USER: warehouse
          API_DB_PASSWORD: warehouse
        run: |
          (cd dbt && dbt build --profiles-dir . --select +exposure:rest_api --indirect-selection cautious)
          scripts/ci/retry.sh pip install -r requirements/api.txt pytest==9.2.0 httpx2==2.16.0
          pytest -q api/tests/test_integration.py
      # The pipeline's writes (the upsert behind idempotent reruns, run tracking) against the same Postgres.
      - name: Warehouse writes against Postgres
        env:
          WAREHOUSE_INTEGRATION: "1"
        run: pytest -q tests/test_warehouse.py

  compose:
    name: Docker compose config + image build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image (runtime + dev targets)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow/Dockerfile
          target: dev
          tags: mallorca-data-platform/airflow:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build REST API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          tags: mallorca-data-platform/api:local
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          tags: mallorca-data-platform/web:local
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: DAG integrity and tests inside the image
        run: >-
          docker run --rm -v "$PWD:/opt/project" -w /opt/project --entrypoint ""
          mallorca-data-platform/airflow:dev pytest -q
