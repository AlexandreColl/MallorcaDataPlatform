name: dbt docs

# Publishes the dbt documentation (models, columns, tests, lineage graph with the Grafana exposure) to GitHub Pages,
# with the coverage report of the same commit's CI run under /coverage/ and the README badge, and keeps the manifest
# of `develop` as an artifact: slim CI compares pull requests against it.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # wait for the CI run of the commit and download its coverage artifact

concurrency:
  group: dbt-docs
  cancel-in-progress: true

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      PGPASSWORD: warehouse
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install dbt-core==1.12.6 dbt-postgres==1.11.0  # dbt-core pinned: see the Dockerfile
      - name: Apply warehouse DDL
        run: psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f core/sql/warehouse.sql
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      # Building on an empty warehouse creates every relation, so the catalog has all columns and types.
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: dbt docs generate
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --static
      - name: Site
        run: mkdir -p site && cp dbt/target/static_index.html site/index.html
      # The coverage of this commit's CI run (it runs in parallel, so wait for it): the HTML report under
      # /coverage/ and a shields.io endpoint for the README badge (core only).
      - name: Coverage report and badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage --dir coverage
          mkdir -p site/coverage && cp -r coverage/htmlcov/. site/coverage/
          python - <<'EOF'
          import json
          percent = json.load(open("coverage/coverage-core.json"))["totals"]["percent_covered"]
          color = "brightgreen" if percent >= 90 else "green" if percent >= 80 else "yellow" if percent >= 70 else "red"
          badge = {"schemaVersion": 1, "label": "coverage (core)", "message": f"{percent:.0f}%", "color": color}
          json.dump(badge, open("site/coverage/badge.json", "w"))
          print(badge)
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Manifest for slim CI
        uses: actions/upload-artifact@v7
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
