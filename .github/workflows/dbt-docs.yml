name: dbt docs

# Publishes the dbt documentation (models, columns, tests, lineage graph with the Grafana exposure) to GitHub Pages
# and keeps the manifest of `develop` as an artifact: slim CI compares pull requests against it.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-docs
  cancel-in-progress: true

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      PGPASSWORD: warehouse
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install dbt-core==1.12.6 dbt-postgres==1.11.0  # dbt-core pinned: see the Dockerfile
      - name: Apply warehouse DDL
        run: psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f core/sql/warehouse.sql
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      # Building on an empty warehouse creates every relation, so the catalog has all columns and types.
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: dbt docs generate
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --static
      - name: Site
        run: mkdir -p site && cp dbt/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Manifest for slim CI
        uses: actions/upload-artifact@v7
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
