name: Release

# Push a tag vX.Y.Z on main -> GitHub Release (notes from CHANGELOG.md) + image on GHCR.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          [[ "$tag" == "$version" ]] || { echo "tag $tag != pyproject $version"; exit 1; }

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG entry for $version"; exit 1; }

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/airflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
