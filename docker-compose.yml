name: mallorca-data-platform

x-platform-env: &platform-env
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_REGION: us-east-1
  BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
  SILVER_BUCKET: ${SILVER_BUCKET:-silver}
  WAREHOUSE_HOST: postgres
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
  WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
  OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
  AQICN_TOKEN: ${AQICN_TOKEN:-}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    target: runtime
  image: mallorca-data-platform/airflow:local
  environment:
    <<: *platform-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-0123456789abcdef0123456789abcdef0123456789abcdef01}
    # Local demo: no login screen. Do not use this setting outside your machine.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./core:/opt/project/core
    - ./connectors:/opt/project/connectors
    - ./config:/opt/project/config
    - ./dbt:/opt/project/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker: mount the parent folder.
      # New volume name so an existing Postgres 16 volume is never opened by 18.
      - postgres18-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Upstream MinIO stopped publishing images in 2025; pgsty/minio is a maintained
    # community build of the same server. Anything S3-compatible works here.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && python -m core.cli init"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mallorca_overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # No background plugin downloads at start-up: only built-in datasources are used.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # The default CARTO basemap now needs an API key; use OpenStreetMap tiles instead.
      GF_GEOMAP_DEFAULT_BASELAYER_CONFIG: '{"type": "osm-standard", "config": {}}'
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader}
    volumes:
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Test/lint toolbox with the same runtime as Airflow: `make test`, `make lint`.
  toolbox:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      target: dev
    image: mallorca-data-platform/airflow:dev
    profiles: ["tools"]
    working_dir: /opt/project
    entrypoint: []
    command: ["pytest"]
    volumes:
      - ./:/opt/project
    depends_on: []

volumes:
  postgres18-data:
  minio-data:
  grafana-data:
  airflow-logs:
