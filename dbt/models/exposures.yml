version: 2

# Downstream consumers of the marts. They show up in the lineage graph of `dbt docs` and can be selected:
# `dbt build --select +exposure:grafana_climate_water` rebuilds and tests everything that dashboard depends on.
# One exposure per Grafana dashboard (dashboards/json/), all in the "Mallorca Data Platform" folder.
exposures:
  - name: grafana_home
    label: Grafana · Mallorca · Inicio
    type: dashboard
    maturity: high
    url: http://localhost:3000/d/mallorca-overview
    description: >
      Home: water, climate and tourism of the last published month, and the map of every georeferenced source.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_resources_monthly')
      - ref('fct_climate_monthly')
      - ref('fct_tourism_monthly')
      - ref('fct_earthquakes')
      - ref('air_quality_hourly')
      - ref('fct_observations')
      - ref('agg_daily_metrics')
      - ref('dim_locations')
      - ref('dim_sources')
      - source('ops', 'ingestion_runs')

  - name: grafana_tourism_resources
    label: Grafana · Mallorca · Turismo y recursos
    type: dashboard
    maturity: medium
    url: http://localhost:3000/d/mallorca-tourism-resources
    description: >
      Tourists, airport passengers and hotel occupancy against groundwater reserves and electricity demand, with the
      anomalies against the same month and a year-by-year evaluation.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_resources_monthly')
      - ref('fct_tourism_monthly')

  - name: grafana_climate_water
    label: Grafana · Mallorca · Clima y agua
    type: dashboard
    maturity: medium
    url: http://localhost:3000/d/mallorca-climate-water
    description: >
      Rainfall and temperature of the AEMET stations against the groundwater reserves: monthly response of the
      aquifers, hydrological years and the state of each aquifer.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_resources_monthly')
      - ref('fct_climate_monthly')
      - ref('fct_water_reserves_monthly')
      - ref('fct_observations')
      - ref('dim_aquifers')

  - name: grafana_mobility
    label: Grafana · Mallorca · Movilidad
    type: dashboard
    maturity: medium
    url: http://localhost:3000/d/mallorca-mobility
    description: Scheduled public transport of EMT Palma and CTM per day and per stop.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_bus_network_daily')
      - ref('fct_island_transit_daily')
      - ref('agg_daily_metrics')
      - ref('dim_locations')

  - name: grafana_weather_environment
    label: Grafana · Mallorca · Tiempo y entorno
    type: dashboard
    maturity: high
    url: http://localhost:3000/d/mallorca-weather
    description: >
      Day-to-day weather (stations and model, with the model bias and weather episodes), air quality, sea and
      earthquakes, plus a metric explorer.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_observations')
      - ref('dim_sources')
      - ref('air_quality_hourly')
      - ref('fct_sea_conditions_hourly')
      - ref('fct_model_bias_daily')
      - ref('fct_weather_episodes')
      - ref('fct_earthquakes')
      - ref('fct_air_quality_model_bias_daily')
      - ref('fct_air_quality_monthly')

  - name: grafana_operations
    label: Grafana · Mallorca · Operación
    type: dashboard
    maturity: high
    url: http://localhost:3000/d/mallorca-operations
    description: >-
      Connector runs, source health, quality rules, series completeness, detected anomalies and the proposed
      corrections (before and after).
    owner:
      name: AlexandreColl
    depends_on:
      - ref('source_health')
      - ref('data_quality_summary')
      - ref('agg_daily_metrics')
      - ref('fct_observations')
      - ref('fct_observations_corrected')
      - source('silver', 'corrections')
      - ref('dim_sources')
      - source('ops', 'ingestion_runs')

  - name: rest_api
    label: REST API (FastAPI)
    type: application
    maturity: medium
    url: http://localhost:8000/docs
    description: >
      Read-only REST API over the gold layer (api/). Its response models mirror these marts, and CI runs every
      query of the API against them after building this exposure's lineage.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('source_health')
      - ref('dim_sources')
      - ref('fct_observations')
      - ref('dim_locations')
      - ref('fct_water_reserves_monthly')
      - ref('dim_aquifers')
      - ref('fct_climate_monthly')
      - ref('fct_tourism_monthly')
      - ref('fct_resources_monthly')
      - ref('fct_observations_corrected')
      - ref('fct_bus_network_daily')
      - ref('fct_island_transit_daily')
      - ref('dim_routes')
      - ref('fct_weather_daily')
      - ref('fct_weather_episodes')
      - ref('agg_model_bias_by_station')
      - ref('air_quality_hourly')
      - ref('fct_sea_conditions_hourly')
      - ref('fct_earthquakes')
      - ref('data_quality_summary')
      - ref('fct_weather_warnings')
      - ref('dim_warning_zones')
      - ref('fct_population_yearly')
      - ref('fct_human_pressure_daily')
      - ref('dim_municipalities')

  - name: web
    label: Web front end · Mallorca en datos
    type: application
    maturity: medium
    url: http://localhost:3002
    description: >
      Web front end (web/) with six dashboards of related data: home, tourism and resources, climate and water,
      mobility, weather and environment, and operations. It reads only the REST API, never the warehouse.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_resources_monthly')
      - ref('fct_tourism_monthly')
      - ref('fct_climate_monthly')
      - ref('fct_water_reserves_monthly')
      - ref('dim_aquifers')
      - ref('dim_locations')
      - ref('dim_sources')
      - ref('source_health')
      - ref('fct_bus_network_daily')
      - ref('fct_island_transit_daily')
      - ref('dim_routes')
      - ref('fct_observations')
      - ref('fct_weather_daily')
      - ref('fct_weather_episodes')
      - ref('agg_model_bias_by_station')
      - ref('air_quality_hourly')
      - ref('fct_sea_conditions_hourly')
      - ref('fct_earthquakes')
      - ref('data_quality_summary')
      - ref('fct_observations_corrected')
      - ref('fct_weather_warnings')
      - ref('dim_warning_zones')
      - ref('fct_population_yearly')
      - ref('fct_human_pressure_daily')
      - ref('dim_municipalities')

  - name: corrections_phase
    label: Corrections with support sources (phase 4)
    type: analysis
    maturity: medium
    description: >
      Phase 4 (ROADMAP): core/corrections fills the gaps and suspect values of the hourly stations (SOCIB, EEA)
      by interpolation or with a nearby support series and its calibrated bias, measured by
      `make evaluate-corrections`. The daily model bias per station (with the altitude effect of the mountain
      stations) is the input for correcting the model itself, still planned.
    owner:
      name: AlexandreColl
    depends_on:
      - ref('fct_model_bias_daily')
      - ref('agg_model_bias_by_station')
      - ref('fct_observations_corrected')
