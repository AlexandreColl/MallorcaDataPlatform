version: 2

sources:
  - name: silver
    description: Clean observations in the common schema, written by the PySpark pipeline.
    tables:
      - name: observations
        columns:
          - name: source
          - name: entity
          - name: metric
          - name: ts
          - name: value
          - name: quality
  - name: quality
    tables:
      - name: check_results
        description: One row per (run, source, rule, target) with checked/failed counts.
  - name: ops
    tables:
      - name: ingestion_runs
        description: Audit of every connector run.
