version: 2

# Tables written by the Python pipeline. dbt only reads them.
#
# silver.observations holds every connector. It is declared once per connector (same identifier, a `filter`)
# so `dbt source freshness` checks each source against its own cadence: hourly APIs are expected every day,
# AEMET publishes 2-3 days late, Dataestur adds a month about every 30 days and IGN only has rows when there are
# earthquakes (no freshness check). The GOIB air quality history ends in June 2021 (no freshness check either).
sources:
  - name: silver
    description: Clean observations in the common schema, written by the PySpark pipeline (one row per series and ts).
    loaded_at_field: updated_at
    freshness:
      warn_after: {count: 36, period: hour}
    tables:
      - name: observations
        description: Every connector, unfiltered. Used by the generic staging model.
        freshness: null
        columns:
          - name: source
            data_tests: [not_null]
          - name: ts
            data_tests: [not_null]
      - {name: open_meteo, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'open_meteo'"}}
      - {name: open_meteo_marine, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'open_meteo_marine'"}}
      - {name: socib, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'socib'"}}
      - {name: redata, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'redata'"}}
      - {name: emt_palma, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'emt_palma'"}}
      - {name: ctm, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'ctm'"}}
      - {name: aemet, identifier: observations, freshness: {warn_after: {count: 5, period: day}, filter: "source = 'aemet'"}}
      - {name: dataestur, identifier: observations, freshness: {warn_after: {count: 40, period: day}, filter: "source = 'dataestur'"}}
      - {name: water_reserves, identifier: observations, freshness: {warn_after: {count: 40, period: day}, filter: "source = 'water_reserves'"}}
      - {name: eea_air_quality, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'eea_air_quality'"}}
      - {name: ign, identifier: observations, freshness: null}
      # Every run writes the archive of its window and the warnings announced for the coming days.
      - {name: aemet_warnings, identifier: observations, freshness: {warn_after: {count: 36, period: hour}, filter: "source = 'aemet_warnings'"}}
      - {name: goib_air_quality, identifier: observations, freshness: null}  # history only (2002 to June 2021)
      # One value per year, published in December: every run re-reads the last three years.
      - {name: ine_population, identifier: observations, freshness: {warn_after: {count: 400, period: day}, filter: "source = 'ine_population'"}}
      - name: entities
        description: >-
          Names of the stops and stations that silver.observations knows only by identifier (stop_452, B228): the
          GTFS stop_name, the AEMET inventory, the station lists of connector.yaml. Upserted on every run.
        freshness: null  # names change rarely: an unchanged name keeps its updated_at
        columns:
          - name: name
            data_tests: [not_null]
      - name: corrections
        description: >-
          Proposed corrections of station values (core/corrections): interpolation of short gaps or a nearby support
          series with a calibrated bias. silver.observations is never changed.
        freshness: null  # rows only exist when a station has gaps
        columns:
          - name: confidence
            data_tests: [not_null]

  - name: quality
    tables:
      - name: check_results
        description: One row per run, source, rule and target with checked and failed counts.

  - name: ops
    tables:
      - name: ingestion_runs
        description: Audit of every connector run (window, status, row counts, error with its exception type).
        loaded_at_field: coalesce(finished_at, started_at)
        freshness:
          warn_after: {count: 36, period: hour}
