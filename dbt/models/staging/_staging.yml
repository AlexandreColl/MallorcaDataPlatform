version: 2

# One staging model per source table: the same projection for every connector (macro staging_observations),
# so marts read `stg_<connector>__observations` and lineage shows which source feeds which mart.
models:
  - name: stg_silver__observations
    description: Every connector's observations, with the local day and missing/suspect flags.
    columns:
      - name: local_date
        data_tests: [not_null]
  - name: stg_silver__entities
    description: Names of the stops and stations, one per source and entity.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, entity]
  - name: stg_silver__routes
    description: Lines of the transit networks with their path, one per source and route.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, route]
  - name: stg_silver__corrections
    description: Proposed corrections of station values, with the local day.
    columns:
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: ["interpolation", "support"]
  - name: stg_open_meteo__observations
    description: Open-Meteo air quality and weather (model), hourly.
  - name: stg_open_meteo_marine__observations
    description: Open-Meteo Marine sea state (model), hourly.
  - name: stg_socib__observations
    description: SOCIB weather stations and buoy (observation), hourly.
  - name: stg_aemet__observations
    description: AEMET official stations (observation), daily.
  - name: stg_redata__observations
    description: REData Balearic electric system, hourly demand and daily generation and CO2.
  - name: stg_emt_palma__observations
    description: EMT Palma scheduled service per stop, daily.
  - name: stg_ctm__observations
    description: CTM island network (TIB buses, SFM trains, metro) scheduled service per stop, daily.
  - name: stg_dataestur__observations
    description: Dataestur (SEGITTUR) monthly Balearic tourism, stamped on the first day of each month.
  - name: stg_water_reserves__observations
    description: Groundwater reserves of Mallorca per aquifer and island-wide, monthly (share of a full aquifer, %).
  - name: stg_eea_air_quality__observations
    description: Official air quality stations of Mallorca (EEA up-to-date data), hourly, in ug/m3.
  - name: stg_goib_air_quality__observations
    description: Official air quality stations of Mallorca (Govern open data), hourly history 2002 to June 2021, in ug/m3.
  - name: stg_aemet_warnings__observations
    description: AEMET warnings (Meteoalerta), one row per zone, phenomenon and hour with its level (0 to 3).
  - name: stg_ine_population__observations
    description: INE municipal register, the population of each municipality of Mallorca on 1 January, by sex.
  - name: stg_ibestat_iph__observations
    description: Ibestat Human Pressure Indicator, the people present in Mallorca each day (residents plus visitors).
  - name: stg_ign__observations
    description: IGN earthquakes (events), one row per event and metric.
  - name: stg_quality__check_results
    description: Results of the quality rules per run.
  - name: stg_ops__ingestion_runs
    description: Connector runs with their duration and the exception type of failures.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["running", "success", "failed", "unavailable"]
