  - name: water_reserve_anomaly_is_against_the_same_calendar_month
    description: February is compared with other Februaries only; the hydrological year starts in September.
    model: fct_water_reserves_monthly
    given:
      - input: ref('stg_water_reserves__observations')
        rows:
          - {entity: mallorca, local_date: "2025-02-01", value: 50, is_missing: false}
          - {entity: mallorca, local_date: "2025-09-01", value: 40, is_missing: false}
          - {entity: mallorca, local_date: "2026-01-01", value: 52, is_missing: false}
          - {entity: mallorca, local_date: "2026-02-01", value: 60, is_missing: false}
      - input: ref('dim_aquifers')
        rows:
          - {entity: aquifer_1805m1, aquifer: Pollença}
    expect:
      rows:
        - {month: "2025-02-01", hydrological_year: 2025, same_month_mean_pct: 55.0, anomaly_pts: -5.0, change_12m_pts: null}
        - {month: "2025-09-01", hydrological_year: 2026, same_month_mean_pct: 40.0, anomaly_pts: 0.0, change_12m_pts: null}
        - {month: "2026-01-01", hydrological_year: 2026, same_month_mean_pct: 52.0, anomaly_pts: 0.0, change_12m_pts: null}
        - {month: "2026-02-01", hydrological_year: 2026, same_month_mean_pct: 55.0, anomaly_pts: 5.0, change_12m_pts: 10.0}

  - name: climate_month_needs_a_complete_station
    description: A station with fewer than 90 % of its days does not count, so a missing week is not a dry month.
    model: fct_climate_monthly
    given:
      - input: ref('int_weather__daily')
        format: sql
        rows: |
          select 'aemet' as source, 'B278' as entity, d::date as local_date, 20.0 as temperature_mean,
                 25.0 as temperature_max, 2.0 as precipitation_sum
          from generate_series('2025-09-01'::date, '2025-09-30', interval '1 day') as d
          union all
          select 'aemet', 'B013', d::date, 15.0, 31.0, 10.0
          from generate_series('2025-09-01'::date, '2025-09-20', interval '1 day') as d
    expect:
      rows:
        - {month: "2025-09-01", hydrological_year: 2026, rain_stations: 1, rain_mm: 60.0, wet_days: 30.0, hot_days: 0.0, rain_anomaly: 0.000}
