  - name: pollen_level_follows_the_rea_thresholds
    description: >
      The level is that of the daily mean, not of the peak hour - olive at 60 grains/m3 for one hour and 0 the next
      is low; the thresholds differ by pollen (40 grains/m3 is low for olive but moderate for grass). A suspect value
      is left out.
