version: 2

models:
  # --- core ----------------------------------------------------------------------------------------------
  - name: fct_observations
    description: >
      Non-missing observations from every source, with quality flags. Incremental merge on silver's `updated_at`:
      each build only reads rows inserted or changed since the previous one.
    data_tests:
      - dbt_utils.recency:
          arguments: {datepart: day, field: ts, interval: 4}
          config: {severity: warn}  # an empty or stale warehouse warns, it does not fail the build
      - unique_combination:
          arguments:
            columns: [source, entity, metric, ts]
    columns:
      - name: source
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sources')
                field: source
      - name: entity
        data_tests: [not_null]
      - name: metric
        data_tests: [not_null]
      - name: ts
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: quality
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect"]

  - name: agg_daily_metrics
    description: >
      Daily min/avg/max (ok values only), suspect count and completeness per series and local day. Incremental
      delete+insert: only the series-days touched since the last build are recomputed, from all their samples.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, entity, metric, local_date]
    columns:
      - name: local_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: completeness
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: dim_locations
    description: >
      One row per source and entity with its name, coordinates and time coverage (events are not locations).
      Entities that are not places (the island's electricity system, a tourism series) have no coordinates. The
      name comes from silver.entities and is null for sources whose identifiers already read as names (Open-Meteo
      points). History of the coordinates: snapshot `snap_locations` (SCD2).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [source, entity]
    columns:
      - {name: source, data_type: text, constraints: [{type: not_null}]}
      - {name: entity, data_type: text, constraints: [{type: not_null}]}
      - {name: name, data_type: text}
      - name: elevation_m
        data_type: double precision
        description: Height above the sea in metres, when the source publishes it (AEMET stations, the Open-Meteo model cell).
      - name: lat
        data_type: double precision
        data_tests:
          - value_between:
              arguments: {min_value: -90, max_value: 90}
      - name: lon
        data_type: double precision
        data_tests:
          - value_between:
              arguments: {min_value: -180, max_value: 180}
      - {name: first_seen, data_type: timestamptz}
      - {name: last_seen, data_type: timestamptz}
      - {name: n_metrics, data_type: bigint}

  - name: dim_metrics
    description: >
      One row per source and metric with its unit and coverage. The primary key makes one unit per metric part of
      the contract: a connector that changes a metric's unit fails the build instead of mixing units in a series.
      Events (earthquakes) are not series: see fct_earthquakes.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [source, metric]
    columns:
      - {name: source, data_type: text, constraints: [{type: not_null}]}
      - {name: metric, data_type: text, constraints: [{type: not_null}]}
      - {name: unit, data_type: text, constraints: [{type: not_null}]}
      - {name: n_entities, data_type: bigint}
      - {name: first_date, data_type: date}
      - {name: last_date, data_type: date}

  - name: dim_date
    description: Calendar from `date_spine_start` to a year ahead (dbt_utils.date_spine), with ISO week, weekend and season.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [date_day]
    columns:
      - {name: date_day, data_type: date, constraints: [{type: not_null}]}
      - {name: year, data_type: integer}
      - {name: quarter, data_type: integer}
      - {name: month, data_type: integer}
      - {name: day_of_month, data_type: integer}
      - {name: iso_day_of_week, data_type: integer}
      - {name: is_weekend, data_type: boolean}
      - {name: iso_week, data_type: text}
      - name: season
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: ["winter", "spring", "summer", "autumn"]

  # --- domains -------------------------------------------------------------------------------------------
  - name: air_quality_hourly
    description: Hourly pollutants with the European AQI band derived from the worst pollutant.
    columns:
      - name: eaqi_label
        data_tests:
          - accepted_values:
              arguments:
                values: ["good", "fair", "moderate", "poor", "very poor", "extremely poor"]

  - name: fct_weather_daily
    description: >
      Daily weather per station or model point on common columns: AEMET and SOCIB observations next to the
      Open-Meteo model. Hourly sources are aggregated to the local day; `is_complete_day` flags days with at
      least 20 hours.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, entity, local_date]
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: temperature_max
            column_B: temperature_min
            or_equal: true
            row_condition: "temperature_max is not null and temperature_min is not null"
    columns:
      - name: source_kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["model", "observation"]
      - name: temperature_mean
        data_tests:
          - value_between:
              arguments: {min_value: -15, max_value: 50}
      - name: precipitation_sum
        data_tests:
          - value_between:
              arguments: {min_value: 0}

  - name: fct_sea_conditions_hourly
    description: Sea state per coastal point and hour from the Open-Meteo Marine model, one column per variable.
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, ts]
    columns:
      - name: wave_height_m
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 20}

  - name: fct_wave_model_comparison_hourly
    description: >
      Buoy vs model per SOCIB wave buoy and hour: the significant wave height measured and the one Open-Meteo Marine
      gave at the nearest point, and the difference (model minus buoy; positive = the model overestimates). Valid
      values on both sides only.
    data_tests:
      - unique_combination:
          arguments:
            columns: [buoy, ts]
    columns:
      - name: wave_height_buoy_m
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 20}
      - name: wave_height_bias_m
        data_tests:
          - value_between:
              arguments: {min_value: -20, max_value: 20}

  - name: agg_wave_model_bias_by_buoy
    description: >-
      Wave model quality per SOCIB buoy: bias, MAE, RMSE and correlation of the hourly significant wave height, the
      mean of each side and the share of the buoy's height the model gives.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [buoy]
    columns:
      - {name: buoy, data_type: text, constraints: [{type: not_null}]}
      - {name: model_point, data_type: text}
      - {name: distance_km, data_type: double precision}
      - {name: hours_compared, data_type: bigint}
      - {name: wave_height_buoy_mean_m, data_type: "numeric(6,2)"}
      - {name: wave_height_model_mean_m, data_type: "numeric(6,2)"}
      - {name: wave_height_bias_m, data_type: "numeric(6,2)", description: Mean of model minus buoy.}
      - name: wave_height_mae_m
        data_type: "numeric(6,2)"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0}
      - {name: wave_height_rmse_m, data_type: "numeric(6,2)"}
      - name: wave_height_correlation
        data_type: "numeric(4,3)"
        description: Pearson r of the hourly heights; empty with fewer than two hours or a constant side.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: -1, max_value: 1}
      - {name: model_ratio, data_type: "numeric(6,2)", description: Mean model height over mean buoy height.}
      - {name: first_ts, data_type: timestamptz}
      - {name: last_ts, data_type: timestamptz}

  - name: fct_electricity_daily
    description: >
      Balearic electric system per local day: demand, generation by technology, renewable share, CO2 and the
      net import through the link with the mainland (demand minus generation).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [local_date]
    columns:
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: demand_mwh, data_type: double precision}
      - {name: demand_hours, data_type: bigint}
      - {name: peak_hour_demand_mwh, data_type: double precision}
      - {name: generation_total_mwh, data_type: double precision}
      - {name: combined_cycle_mwh, data_type: double precision}
      - {name: gas_turbine_mwh, data_type: double precision}
      - {name: diesel_engines_mwh, data_type: double precision}
      - {name: cogeneration_mwh, data_type: double precision}
      - {name: non_renewable_waste_mwh, data_type: double precision}
      - {name: renewable_waste_mwh, data_type: double precision}
      - {name: solar_pv_mwh, data_type: double precision}
      - {name: other_renewables_mwh, data_type: double precision}
      - {name: co2_emissions_t, data_type: double precision}
      - {name: co2_intensity_t_per_mwh, data_type: double precision}
      - name: renewable_share
        data_type: "numeric(5,4)"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 1}
      - {name: net_import_mwh, data_type: "numeric(10,1)"}

  - name: fct_bus_network_daily
    description: EMT Palma network per local day (stops with service, scheduled stop calls, busiest stop).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [local_date]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stops_with_service <= stops"
    columns:
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: iso_day_of_week, data_type: integer}
      - {name: is_weekend, data_type: boolean}
      - {name: stops, data_type: bigint}
      - {name: stops_with_service, data_type: bigint}
      - {name: scheduled_stop_calls, data_type: double precision}
      - {name: avg_lines_per_served_stop, data_type: "numeric(6,2)"}
      - {name: busiest_stop, data_type: text}
      - {name: busiest_stop_name, data_type: text}
      - {name: busiest_stop_departures, data_type: double precision}

  - name: fct_bike_stations_hourly
    description: >-
      BiciPalma, one row per station and UTC hour: the mean, minimum and maximum of the free bikes and free docks
      of the 5-minute snapshots of that hour, the mean e-bikes and occupancy, and whether the station ran out of bikes
      or of docks at some moment. Incremental delete+insert on the station-hours changed since the last build.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [station, ts]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "bikes_available_min <= bikes_available and bikes_available <= bikes_available_max"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ebikes_available <= bikes_available"
    columns:
      - {name: station, data_type: text, description: "GBFS station_id as entity, e.g. station_91733840.", constraints: [{type: not_null}]}
      - {name: station_name, data_type: text, description: "As BiciPalma numbers it, e.g. 01 PARC DE SES VELES."}
      - {name: lat, data_type: double precision}
      - {name: lon, data_type: double precision}
      - {name: ts, data_type: timestamp with time zone, description: Start of the UTC hour., constraints: [{type: not_null}]}
      - {name: local_date, data_type: date}
      - {name: local_hour, data_type: integer, description: Hour of the day in Mallorca (0-23).}
      - {name: bikes_available, data_type: "numeric(6,2)", description: Mean free bikes in the hour.}
      - {name: bikes_available_min, data_type: integer}
      - {name: bikes_available_max, data_type: integer}
      - {name: ebikes_available, data_type: "numeric(6,2)", description: Mean free bikes with electric assist.}
      - {name: docks_available, data_type: "numeric(6,2)", description: Mean free docks in the hour.}
      - {name: docks_available_min, data_type: integer}
      - {name: docks_available_max, data_type: integer}
      - name: occupancy_pct
        data_type: "numeric(5,1)"
        description: Mean of bikes / (bikes + free docks) of the snapshots, in %. Broken docks count neither way.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 100}
      - {name: was_empty, data_type: boolean, description: No bike left at some snapshot of the hour.}
      - {name: was_full, data_type: boolean, description: No free dock left at some snapshot of the hour.}
      - {name: has_suspect, data_type: boolean, description: Some value of the hour was flagged by the quality rules.}
      - {name: last_updated_at, data_type: timestamp with time zone}

  - name: fct_bike_stations_daily
    description: >-
      BiciPalma, one row per station and local day: hours observed, mean bikes, e-bikes, docks and occupancy, the
      hours it ran out of bikes or of docks, its working docks and its largest hourly swing of bikes.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [station, local_date]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hours_empty <= hours_observed and hours_full <= hours_observed"
    columns:
      - {name: station, data_type: text, constraints: [{type: not_null}]}
      - {name: station_name, data_type: text}
      - {name: lat, data_type: double precision}
      - {name: lon, data_type: double precision}
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - name: hours_observed
        data_type: integer
        description: Hours with at least one snapshot (24 when the poller ran all day; 23 or 25 on clock changes).
        data_tests:
          - value_between:
              arguments: {min_value: 1, max_value: 25}
      - {name: bikes_available, data_type: "numeric(6,2)"}
      - {name: bikes_available_min, data_type: integer}
      - {name: bikes_available_max, data_type: integer}
      - {name: ebikes_available, data_type: "numeric(6,2)"}
      - {name: docks_available, data_type: "numeric(6,2)"}
      - {name: occupancy_pct, data_type: "numeric(5,1)"}
      - {name: working_docks, data_type: integer, description: Bikes plus free docks at the hour they added up most.}
      - {name: hours_empty, data_type: integer, description: Hours in which the station ran out of bikes at some moment.}
      - {name: hours_full, data_type: integer, description: Hours in which it ran out of free docks.}
      - {name: largest_hourly_swing, data_type: integer, description: Largest maximum minus minimum of bikes in one hour.}

  - name: dim_routes
    description: >-
      One row per line of the EMT Palma and CTM networks: its short and long name, kind (bus, train, metro, tram),
      colour and path (the main shape of each direction, simplified, as a GeoJSON MultiLineString). The daily
      departures of a line are the `scheduled_trips` series of the same entity.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [source, route]
    columns:
      - {name: source, data_type: text, constraints: [{type: not_null}]}
      - {name: route, data_type: text, constraints: [{type: not_null}]}
      - {name: short_name, data_type: text, constraints: [{type: not_null}]}
      - {name: name, data_type: text, constraints: [{type: not_null}]}
      - name: kind
        data_type: text
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: ["bus", "train", "metro", "tram"]
              config: {severity: warn}
      - {name: color, data_type: text}
      - {name: geometry, data_type: jsonb, constraints: [{type: not_null}]}

  - name: fct_island_transit_daily
    description: >-
      CTM island network (TIB buses, SFM trains, metro) per local day: stops with service, scheduled stop calls,
      busiest stop. Same columns as fct_bus_network_daily (both come from the transit_network_daily macro).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [local_date]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stops_with_service <= stops"
    columns:
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: iso_day_of_week, data_type: integer}
      - {name: is_weekend, data_type: boolean}
      - {name: stops, data_type: bigint}
      - {name: stops_with_service, data_type: bigint}
      - {name: scheduled_stop_calls, data_type: double precision}
      - {name: avg_lines_per_served_stop, data_type: "numeric(6,2)"}
      - {name: busiest_stop, data_type: text}
      - {name: busiest_stop_name, data_type: text}
      - {name: busiest_stop_departures, data_type: double precision}

  - name: fct_earthquakes
    description: One row per earthquake located by the IGN (magnitude, depth, epicentre, distance from Palma).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: ts
        data_tests: [not_null]
      - name: magnitude
        data_tests: [not_null]

  # --- quality and operations ----------------------------------------------------------------------------
  - name: data_quality_summary
    description: Latest quality-check result per source, rule and target.
    columns:
      - name: rule
        data_tests: [not_null]

  - name: source_health
    description: >
      One row per source in `dim_sources`: last run and its error type, last successful load, failures in the
      last 7 days and the age of its newest observation, with the governance of the source (owner, licence,
      access, personal data, classification, lifecycle) and whether it meets its agreed SLA.
    columns:
      - name: source
        data_tests: [not_null, unique]
      - name: sla_age_met
        description: Newest value no older than `sla_data_age_hours`. Null when the SLA sets no age or there is no value.
      - name: sla_success_met
        description: Share of successful runs in 7 days at least `sla_success_rate`. Null when the source did not run.
      - name: sla_met
        description: False if either part is breached, true if a known part is met and none is breached, else null.
      - name: failed_7d
        description: Runs in 7 days that failed on our side (a bug, a changed format, a rejected key).
      - name: unavailable_7d
        description: Runs in 7 days whose source was down (unreachable, 5xx, not publishing yet).
      - name: failure_rate_7d
        description: Share of the runs in 7 days that did not load, failed or unavailable.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}

  - name: fct_anomaly_evaluations
    description: >-
      Fault-injection benchmark of the anomaly detectors (make evaluate): per run, source, detector and fault kind,
      the injected faults and values, how many the detector flagged and, on the fault = 'all' row, its precision and
      false alarms. `is_latest` marks the newest run of each source, the one the API and the web show.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [run_id, source, detector, fault]
    columns:
      - {name: run_id, data_type: text, constraints: [{type: not_null}]}
      - {name: source, data_type: text, constraints: [{type: not_null}]}
      - {name: detector, data_type: text, constraints: [{type: not_null}]}
      - name: fault
        data_type: text
        constraints: [{type: not_null}]
        description: The kind of injected fault (core/anomaly/faults.py), or `all` for the totals.
        data_tests:
          - accepted_values:
              arguments:
                values: ["spike", "frozen", "drift", "shift", "all"]
      - {name: window_start, data_type: date}
      - {name: window_end, data_type: date}
      - {name: seed, data_type: integer}
      - {name: series, data_type: integer, description: Series of the source that were corrupted.}
      - {name: events, data_type: integer, description: Faults injected.}
      - {name: events_detected, data_type: integer, description: Faults with at least one of their values flagged.}
      - {name: points, data_type: integer, description: Values changed by the faults.}
      - {name: points_detected, data_type: integer}
      - name: recall
        data_type: double precision
        description: Share of the changed values that were flagged.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - name: event_recall
        data_type: double precision
        description: Share of the faults with some value flagged.
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - {name: false_alarms, data_type: integer, description: New flags on clean values (fault = 'all' only).}
      - {name: baseline_flags, data_type: integer, description: Flags already on the clean series, real events not judged.}
      - name: precision
        data_type: double precision
        description: Flags on injected values over all new flags (fault = 'all' only).
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
      - {name: evaluated_at, data_type: timestamp with time zone}
      - {name: is_latest, data_type: boolean, description: The row belongs to the newest run of its source.}

  # --- station vs model and weather episodes -------------------------------------------------------------
  - name: fct_model_bias_daily
    description: >
      Station vs model per station and day: AEMET or SOCIB observation, Open-Meteo at the nearest model point
      and the difference (model minus observation; positive = the model overestimates). Complete days only. The
      `_adjusted` temperature biases first bring the model to the height of the station with the standard lapse
      rate (`lapse_rate_c_per_km`), so a mountain station measures the model and not the altitude.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_source, station, local_date]
    columns:
      - name: distance_km
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 25}
      - name: elevation_diff_m
        description: Height of the station minus that of the model cell (positive = the station stands higher).
      - name: altitude_adjustment_c
        description: Added to the model's temperatures to compare them at the station's height; 0 without both heights.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: -10, max_value: 10}
      - name: temperature_mean_bias
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: -15, max_value: 15}
      - name: temperature_mean_bias_adjusted
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: -15, max_value: 15}

  - name: agg_model_bias_by_station
    description: >-
      Model quality per station (bias, MAE and RMSE of the daily mean temperature, raw and at the station's height;
      rain bias and agreement).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [station_source, station]
    columns:
      - {name: station_source, data_type: text, constraints: [{type: not_null}]}
      - {name: station, data_type: text, constraints: [{type: not_null}]}
      - {name: model_point, data_type: text}
      - {name: distance_km, data_type: double precision}
      - {name: elevation_diff_m, data_type: double precision, description: Height of the station minus that of the model cell.}
      - {name: days_compared, data_type: bigint}
      - {name: temperature_bias_c, data_type: "numeric(6,2)"}
      - name: temperature_mae_c
        data_type: "numeric(6,2)"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0}
      - {name: temperature_rmse_c, data_type: "numeric(6,2)"}
      - {name: temperature_bias_adjusted_c, data_type: "numeric(6,2)", description: Mean bias at the station's height.}
      - name: temperature_mae_adjusted_c
        data_type: "numeric(6,2)"
        description: Mean absolute error at the station's height.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0}
      - {name: temperature_rmse_adjusted_c, data_type: "numeric(6,2)"}
      - {name: precipitation_bias_total_mm, data_type: "numeric(8,1)"}
      - name: rain_day_agreement
        data_type: "numeric(4,3)"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0, max_value: 1}
      - {name: wind_speed_bias_kmh, data_type: "numeric(6,2)"}
      - {name: first_day, data_type: date}
      - {name: last_day, data_type: date}

  - name: fct_weather_episodes
    description: >
      Runs of consecutive days with heavy rain, strong wind or rough sea anywhere around the island (thresholds
      in `vars`), built with gaps and islands; one row per episode with its peaks.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [episode_id]
    data_tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments: {column_A: end_date, column_B: start_date, or_equal: true}
    columns:
      - {name: episode_id, data_type: text, constraints: [{type: not_null}]}
      - {name: start_date, data_type: date}
      - {name: end_date, data_type: date}
      - {name: days, data_type: bigint}
      - {name: episode_type, data_type: text}
      - {name: peak_rain_mm, data_type: double precision}
      - {name: peak_rain_station, data_type: text}
      - {name: peak_rain_day, data_type: date}
      - {name: max_stations_over_rain_threshold, data_type: bigint}
      - {name: peak_gust_kmh, data_type: double precision}
      - {name: peak_wave_m, data_type: double precision}

  - name: fct_weather_warnings
    description: >
      AEMET warnings of the zones of Mallorca as periods: consecutive hours of one zone and phenomenon at the same
      level (1 yellow, 2 orange, 3 red), built with gaps and islands from the hourly levels of aemet_warnings.
      Includes the warnings announced for the coming days, which the next runs settle with the archive.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [warning_id]
    data_tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments: {column_A: end_ts, column_B: start_ts}
    columns:
      - {name: warning_id, data_type: text, constraints: [{type: not_null}]}
      - name: zone
        data_type: text
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_warning_zones')
                field: zone
      - {name: zone_name, data_type: text}
      - name: zone_kind
        data_type: text
      - {name: phenomenon, data_type: text, constraints: [{type: not_null}]}
      - name: level
        data_type: integer
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - {name: start_ts, data_type: timestamptz}
      - {name: end_ts, data_type: timestamptz}
      - {name: hours, data_type: bigint}

  - name: fct_human_pressure_daily
    description: >-
      People actually present in Mallorca each day (Ibestat Human Pressure Indicator, residents plus visitors) against
      the people registered there (INE municipal register of that year, or the latest one before it), since 1997.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [local_date]
    columns:
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: iso_day_of_week, data_type: integer}
      - {name: is_weekend, data_type: boolean}
      - name: people_present
        data_type: integer
        description: Human Pressure Indicator, the people present on the island that day.
        data_tests:
          - value_between:
              arguments: {min_value: 300000, max_value: 2500000}
      - {name: register_year, data_type: integer, description: Year of the register the residents come from.}
      - {name: residents, data_type: integer, description: Population of Mallorca in that register.}
      - name: people_over_residents
        data_type: integer
        description: People present minus residents (the visitors net of the residents who are away).
      - {name: pressure_ratio, data_type: "numeric(6,3)", description: People present over residents.}

  - name: fct_population_yearly
    description: >-
      Population of each municipality of Mallorca on 1 January (INE municipal register, padrón continuo), by sex,
      with its density and the change against the previous register (1996-2025; there was no register in 1997).
      Mallorca's total is the sum of its municipalities.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [municipality, year]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "population_men + population_women = population"
          config:
            where: "population_men is not null and population_women is not null"
    columns:
      - name: municipality
        data_type: text
        description: INE municipality code.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipalities')
                field: municipality
      - {name: municipality_name, data_type: text}
      - {name: year, data_type: integer, description: Year of the register (population on 1 January)., constraints: [{type: not_null}]}
      - {name: population, data_type: integer}
      - {name: population_men, data_type: integer}
      - {name: population_women, data_type: integer}
      - {name: area_km2, data_type: double precision}
      - {name: density_per_km2, data_type: "numeric(10,1)", description: Inhabitants per km2.}
      - {name: previous_year, data_type: integer, description: Year of the previous register (1996 for 1998).}
      - {name: population_change, data_type: integer, description: Change against the previous register.}
      - {name: population_change_pct, data_type: "numeric(8,4)", description: Relative change (0.01 = +1 %).}

  - name: fct_tourism_monthly
    description: >-
      Balearic tourism per month (Dataestur): international tourists and spending (FRONTUR, EGATUR), hotel
      occupancy (EOH), Palma airport passengers (AENA), cruise passengers and calls of the Balearic port authority
      (Puertos del Estado, the five ports together) and the change against the same month a year earlier.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hotel_bed_occupancy_pct between 0 and 100"
          config:
            where: "hotel_bed_occupancy_pct is not null"
    columns:
      - {name: month, data_type: date, description: First day of the month., constraints: [{type: not_null}]}
      - {name: international_tourists, data_type: double precision}
      - {name: international_spending_eur, data_type: double precision}
      - {name: international_tourist_nights, data_type: double precision}
      - {name: spending_per_tourist_eur, data_type: "numeric(10,2)"}
      - {name: hotel_guests, data_type: double precision}
      - {name: hotel_nights, data_type: double precision}
      - {name: hotel_average_stay_nights, data_type: "numeric(6,2)"}
      - {name: hotel_bed_occupancy_pct, data_type: double precision}
      - {name: hotels_open, data_type: double precision}
      - {name: hotel_staff, data_type: double precision}
      - {name: airport_passengers, data_type: double precision}
      - {name: cruise_passengers, data_type: double precision, description: "Cruise passengers of the five ports of the Balearic port authority, base and transit together."}
      - {name: cruise_calls, data_type: double precision, description: Cruise ship calls.}
      - {name: cruise_passengers_per_call, data_type: "numeric(8,0)"}
      - {name: port_passengers, data_type: double precision, description: "All passengers of the port authority: ferries and cruises."}
      - {name: international_tourists_yoy, data_type: "numeric(8,4)", description: Change against the same month a year earlier (0.05 = +5 %).}
      - {name: airport_passengers_yoy, data_type: "numeric(8,4)"}
      - {name: cruise_passengers_yoy, data_type: "numeric(8,4)"}

  - name: fct_tourist_dwellings
    description: >-
      Tourist dwellings of each municipality of Mallorca per reference month (INE experimental statistic, the
      listings of the main holiday rental platforms): dwellings, beds, beds per dwelling, their weight against the
      population of the municipality and the change against the previous count. Counted twice a year since August
      2020, on reference months that have moved (February and August, since November 2024 May and November).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [municipality, reference_month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tourist_beds >= tourist_dwellings"
          config:
            where: "tourist_beds is not null and tourist_dwellings is not null"
    columns:
      - name: municipality
        data_type: text
        description: INE municipality code.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipalities')
                field: municipality
      - {name: municipality_name, data_type: text}
      - {name: reference_month, data_type: date, description: First day of the month the listings were counted in., constraints: [{type: not_null}]}
      - {name: tourist_dwellings, data_type: integer, description: Dwellings listed for tourist stays.}
      - {name: tourist_beds, data_type: integer, description: Beds (plazas) of those dwellings.}
      - {name: beds_per_dwelling, data_type: "numeric(6,2)"}
      - {name: population_year, data_type: integer, description: Year of the register the ratios use (the latest up to the reference month).}
      - {name: population, data_type: integer}
      - {name: dwellings_per_1000_inhabitants, data_type: "numeric(8,1)"}
      - {name: beds_per_100_inhabitants, data_type: "numeric(8,1)", description: Tourist beds in dwellings per 100 residents.}
      - {name: previous_month, data_type: date, description: Reference month of the previous count.}
      - {name: dwellings_change, data_type: integer, description: Change against the previous count.}
      - {name: dwellings_change_pct, data_type: "numeric(8,4)", description: Relative change (0.01 = +1 %).}

  - name: fct_unemployment_monthly
    description: >-
      Registered unemployment of each municipality of Mallorca per month (SEPE, Paro registrado por municipios): the
      people registered as unemployed on the last working day of the month, by sex and age band and by sector, per
      1,000 inhabitants of the register, against the same month a year earlier and against the mean of the same
      calendar month. Since 2022 every count from 1 to 4 is published as "<5" and is null here; `is_suppressed` marks
      a total that is one of them.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [municipality, month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "unemployed_men + unemployed_women = unemployed"
          config:
            where: "unemployed_men is not null and unemployed_women is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "unemployed is null"
          config:
            where: "is_suppressed"
    columns:
      - name: municipality
        data_type: text
        description: INE municipality code.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipalities')
                field: municipality
      - {name: municipality_name, data_type: text}
      - {name: month, data_type: date, description: First day of the month (the register of its last working day)., constraints: [{type: not_null}]}
      - name: season
        data_type: text
        description: "`summer` June to September, `winter` November to February, null for the months between."
        data_tests:
          - accepted_values:
              arguments:
                values: ["summer", "winter"]
      - {name: is_suppressed, data_type: boolean, description: 'The total was published as "<5" (1 to 4 people).'}
      - {name: unemployed, data_type: integer, description: People registered as unemployed; null when suppressed.}
      - {name: unemployed_men, data_type: integer, description: Sum of the three bands of men; null if any is suppressed.}
      - {name: unemployed_women, data_type: integer, description: Sum of the three bands of women; null if any is suppressed.}
      - {name: unemployed_under_25, data_type: integer}
      - {name: unemployed_45_plus, data_type: integer}
      - {name: unemployed_men_under_25, data_type: integer}
      - {name: unemployed_men_25_44, data_type: integer}
      - {name: unemployed_men_45_plus, data_type: integer}
      - {name: unemployed_women_under_25, data_type: integer}
      - {name: unemployed_women_25_44, data_type: integer}
      - {name: unemployed_women_45_plus, data_type: integer}
      - {name: unemployed_agriculture, data_type: integer}
      - {name: unemployed_industry, data_type: integer}
      - {name: unemployed_construction, data_type: integer}
      - {name: unemployed_services, data_type: integer}
      - {name: unemployed_no_previous_job, data_type: integer, description: Registered without a previous job.}
      - {name: population_year, data_type: integer, description: Year of the register the ratio uses (the latest up to the month).}
      - {name: population, data_type: integer}
      - {name: unemployed_per_1000_inhabitants, data_type: "numeric(8,1)", description: Against the whole population of the register, not the working age.}
      - {name: unemployed_yoy, data_type: "numeric(8,4)", description: Against the same month a year earlier (0.01 = +1 %).}
      - {name: same_month_mean, data_type: "numeric(10,1)", description: Mean of this calendar month over every year loaded.}
      - {name: unemployed_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same calendar month (0.1 = 10 % more).}

  - name: fct_unemployment_island_monthly
    description: >-
      Registered unemployment of Mallorca as a whole per month (SEPE): the sum of its 53 municipalities, by sex, age
      and sector, per 1,000 inhabitants of the register, against the same month a year earlier and against the mean of
      the same calendar month. A suppressed municipal total ("<5") adds nothing, so the island is short by at most 4
      people for each of `suppressed_municipalities`.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "unemployed_men + unemployed_women <= unemployed + 4 * 6 * municipalities"
    columns:
      - {name: month, data_type: date, description: First day of the month., constraints: [{type: not_null}]}
      - {name: season, data_type: text, description: "`summer` June to September, `winter` November to February."}
      - {name: municipalities, data_type: integer, description: Municipalities in the file that month (53).}
      - {name: suppressed_municipalities, data_type: integer, description: 'Municipalities whose total was "<5".'}
      - {name: unemployed, data_type: integer}
      - {name: unemployed_men, data_type: integer, description: Sum of the published cells of the three bands of men.}
      - {name: unemployed_women, data_type: integer, description: Sum of the published cells of the three bands of women.}
      - {name: unemployed_under_25, data_type: integer}
      - {name: unemployed_45_plus, data_type: integer}
      - {name: unemployed_agriculture, data_type: integer}
      - {name: unemployed_industry, data_type: integer}
      - {name: unemployed_construction, data_type: integer}
      - {name: unemployed_services, data_type: integer}
      - {name: unemployed_no_previous_job, data_type: integer}
      - {name: services_share, data_type: "numeric(6,3)", description: Share of the unemployed whose last job was in services.}
      - {name: population, data_type: integer, description: Sum of the registers the municipalities use that month.}
      - {name: unemployed_per_1000_inhabitants, data_type: "numeric(8,1)"}
      - {name: unemployed_yoy, data_type: "numeric(8,4)", description: Against the same month a year earlier.}
      - {name: same_month_mean, data_type: "numeric(10,0)", description: Mean of this calendar month over every year loaded.}
      - {name: unemployed_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same calendar month.}

  - name: agg_unemployment_seasonality
    description: >-
      How seasonal registered unemployment is per calendar year, for Mallorca (`area` = mallorca) and each
      municipality: the mean of the winter months (November to February) against that of the summer months (June to
      September). A ratio only for years with the four summer months and three winter ones at least, and for a
      municipality without suppressed totals that year.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [area, year]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "winter_summer_ratio > 0"
          config:
            where: "winter_summer_ratio is not null"
    columns:
      - {name: area, data_type: text, description: "`mallorca` or the INE code of a municipality.", constraints: [{type: not_null}]}
      - {name: area_name, data_type: text}
      - {name: year, data_type: integer, constraints: [{type: not_null}]}
      - {name: summer_months, data_type: integer}
      - {name: winter_months, data_type: integer}
      - {name: summer_mean, data_type: "numeric(10,0)"}
      - {name: winter_mean, data_type: "numeric(10,0)"}
      - {name: lowest_month, data_type: integer, description: Lowest month of the year.}
      - {name: highest_month, data_type: integer, description: Highest month of the year.}
      - {name: winter_summer_ratio, data_type: "numeric(8,3)", description: Winter mean / summer mean (1.6 = 60 % more unemployed in winter).}

  - name: fct_water_reserves_monthly
    description: >-
      Groundwater reserves of Mallorca per month (Govern de les Illes Balears): island-wide share of a full aquifer,
      change against the previous month and year, and anomaly against the mean of the same calendar month.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "reserves_pct between 0 and 100"
    columns:
      - {name: month, data_type: date, description: First day of the month., constraints: [{type: not_null}]}
      - {name: hydrological_year, data_type: integer, description: September to August, named after the year it ends in.}
      - {name: reserves_pct, data_type: double precision}
      - {name: change_1m_pts, data_type: double precision, description: Percentage points against the previous month.}
      - {name: change_12m_pts, data_type: double precision, description: Percentage points against the same month a year earlier.}
      - {name: same_month_mean_pct, data_type: "numeric(5,1)", description: Mean of this calendar month over every year loaded.}
      - {name: anomaly_pts, data_type: "numeric(5,1)", description: Reserves minus the mean of the same calendar month.}
      - {name: same_month_years, data_type: bigint}
      - {name: aquifers, data_type: bigint}
      - {name: aquifers_below_30_pct, data_type: bigint}
      - {name: lowest_aquifer, data_type: text}
      - {name: lowest_aquifer_pct, data_type: double precision}

  - name: fct_bathing_water_seasons
    description: >-
      One row per bathing water of Mallorca and season (Náyade, Ministerio de Sanidad): its samples, worst results
      and restrictions, and the classification of the Bathing Water Directive (2006/7/EC, annex II) computed on the
      samples of that season and the three before it. A reproduction of the method on the published samples, not the
      official classification (which may leave out samples of short-term pollution).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [bathing_water, season]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quality_class between 1 and 4"
          config:
            where: "quality_class is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "assessed_samples >= 16"
          config:
            where: "quality_class is not null"
    columns:
      - {name: bathing_water, data_type: text, description: Náyade id of the bathing water (codZona)., constraints: [{type: not_null}]}
      - {name: name, data_type: text, description: Name of the bathing water in Náyade.}
      - name: municipality
        data_type: text
        description: INE code of the municipality.
        data_tests:
          - relationships:
              arguments: {to: ref('dim_municipalities'), field: municipality}
      - {name: municipality_name, data_type: text}
      - {name: sampling_points, data_type: integer, description: Sampling points of the water with samples loaded.}
      - {name: lat, data_type: double precision, description: Mean of its sampling points.}
      - {name: lon, data_type: double precision}
      - {name: season, data_type: integer, description: Year of the bathing season (samples from April to September)., constraints: [{type: not_null}]}
      - {name: samples, data_type: integer, description: Point-days with a result that season.}
      - {name: last_sample_date, data_type: date}
      - {name: worst_e_coli, data_type: integer, description: Highest E. coli of the season (cfu/100 ml).}
      - {name: worst_enterococci, data_type: integer, description: Highest intestinal enterococci of the season (cfu/100 ml).}
      - {name: samples_not_fit, data_type: integer, description: Samples that came with advice against bathing or a ban.}
      - {name: restrictions, data_type: integer, description: Restrictions opened that season (advice against bathing or ban).}
      - {name: bans, data_type: integer, description: Restrictions that banned bathing.}
      - {name: restricted_days, data_type: integer, description: Days of the restrictions closed so far.}
      - {name: assessed_samples, data_type: integer, description: Samples of the four-season set the class is computed on.}
      - {name: assessed_seasons, data_type: integer, description: Seasons of that set with samples (four once Náyade's history is loaded).}
      - {name: p95_e_coli, data_type: "numeric(10,1)", description: "95th percentile of the directive, 10^(mean + 1.65 sd) of the log10 results."}
      - {name: p95_enterococci, data_type: "numeric(10,1)"}
      - {name: p90_e_coli, data_type: "numeric(10,1)", description: "90th percentile of the directive, 10^(mean + 1.282 sd)."}
      - {name: p90_enterococci, data_type: "numeric(10,1)"}
      - {name: quality_class, data_type: integer, description: "4 excellent, 3 good, 2 sufficient, 1 poor; null with fewer than 16 samples."}
      - name: quality
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [excellent, good, sufficient, poor]}
      - {name: previous_quality_class, data_type: integer, description: Class of the previous season.}
      - {name: quality_class_change, data_type: integer, description: "Against the previous season: +1 one class better, -1 one worse."}

  - name: fct_bathing_water_island_yearly
    description: >-
      The bathing waters of Mallorca as a whole per season (Náyade): how many fall in each class of the Bathing Water
      Directive, the share of excellent ones among those classified, and the samples with advice against bathing and
      the restrictions of the season.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [season]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "excellent + good + sufficient + poor = classified"
    columns:
      - {name: season, data_type: integer, constraints: [{type: not_null}]}
      - {name: bathing_waters, data_type: integer, description: Bathing waters with samples that season.}
      - {name: classified, data_type: integer, description: Those with at least 16 samples in their four-season set.}
      - {name: excellent, data_type: integer}
      - {name: good, data_type: integer}
      - {name: sufficient, data_type: integer}
      - {name: poor, data_type: integer}
      - {name: excellent_share, data_type: "numeric(6,3)", description: Excellent / classified.}
      - {name: downgraded, data_type: integer, description: Waters one class or more below the previous season.}
      - {name: upgraded, data_type: integer}
      - {name: samples, data_type: integer}
      - {name: samples_not_fit, data_type: integer}
      - {name: samples_not_fit_share, data_type: "numeric(6,4)"}
      - {name: restrictions, data_type: integer}
      - {name: bans, data_type: integer}
      - {name: restricted_days, data_type: integer}
      - {name: worst_e_coli, data_type: integer}
      - {name: worst_enterococci, data_type: integer}

  - name: fct_climate_monthly
    description: >-
      Climate of Mallorca per month from the official AEMET stations (mean of the stations that reported at least
      90 % of the month): rainfall and temperature with their anomaly against the same calendar month, hot and wet
      days, and the rainfall accumulated in the hydrological year (September to August).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    columns:
      - {name: month, data_type: date, description: First day of the month., constraints: [{type: not_null}]}
      - {name: hydrological_year, data_type: integer, description: September to August, named after the year it ends in.}
      - {name: rain_stations, data_type: bigint, description: Stations with a complete month of rainfall.}
      - {name: rain_mm, data_type: "numeric(7,1)", description: Mean rainfall of those stations.}
      - {name: rain_same_month_mean_mm, data_type: "numeric(7,1)"}
      - {name: rain_anomaly, data_type: "numeric(8,3)", description: Rainfall against the mean of the same month (0.2 = 20 % more).}
      - {name: rain_hydrological_year_mm, data_type: "numeric(7,1)", description: Rainfall since September.}
      - {name: rain_hydrological_year_mean_mm, data_type: "numeric(7,1)", description: Mean of the same accumulated value in the other years.}
      - {name: wet_days, data_type: "numeric(4,1)", description: Days with at least 1 mm, mean of the stations.}
      - {name: temperature_stations, data_type: bigint}
      - {name: temperature_mean_c, data_type: "numeric(5,2)"}
      - {name: temperature_anomaly_c, data_type: "numeric(5,2)", description: Against the mean of the same month.}
      - {name: temperature_max_c, data_type: double precision, description: Highest daily maximum of any complete station.}
      - {name: hot_days, data_type: "numeric(4,1)", description: Days with a maximum of 30 °C or more, mean of the stations.}
      - {name: same_month_years, data_type: bigint}

  - name: fct_resources_monthly
    description: >-
      One row per month with tourism (Dataestur, cruise passengers included), groundwater reserves, rainfall and temperature (AEMET),
      electricity demand (REData) and registered unemployment (SEPE), each with its anomaly against the same calendar month, because every series is
      seasonal. Feeds the "Turismo y recursos" and "Clima y agua" dashboards.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    columns:
      - {name: month, data_type: date, description: First day of the month., constraints: [{type: not_null}]}
      - {name: hydrological_year, data_type: integer, description: September to August, named after the year it ends in.}
      - {name: international_tourists, data_type: double precision}
      - {name: tourists_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same month (0.1 = 10 % more).}
      - {name: international_spending_eur, data_type: double precision}
      - {name: airport_passengers, data_type: double precision}
      - {name: cruise_passengers, data_type: double precision}
      - {name: cruise_passengers_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same month.}
      - {name: hotel_bed_occupancy_pct, data_type: double precision}
      - {name: electricity_demand_gwh, data_type: "numeric(8,1)", description: Balearic demand; null for months with less than 90 % of their hours.}
      - {name: electricity_demand_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same month.}
      - {name: reserves_pct, data_type: double precision}
      - {name: reserves_change_1m_pts, data_type: double precision}
      - {name: reserves_anomaly_pts, data_type: "numeric(5,1)"}
      - {name: rain_mm, data_type: "numeric(7,1)"}
      - {name: rain_hydrological_year_mm, data_type: "numeric(7,1)"}
      - {name: rain_anomaly, data_type: "numeric(8,3)"}
      - {name: temperature_mean_c, data_type: "numeric(5,2)"}
      - {name: temperature_anomaly_c, data_type: "numeric(5,2)"}
      - {name: hot_days, data_type: "numeric(4,1)"}
      - {name: unemployed, data_type: integer, description: People registered as unemployed in Mallorca (SEPE).}
      - {name: unemployed_per_1000_inhabitants, data_type: "numeric(8,1)"}
      - {name: unemployed_anomaly, data_type: "numeric(8,3)", description: Against the mean of the same month.}

  - name: fct_air_quality_model_bias_daily
    description: >-
      Daily mean of each official air quality station (EEA) next to the Open-Meteo CAMS model at the nearest model
      point, per pollutant (PM10, PM2.5, NO2, O3); bias = model minus station. Days with at least 18 valid hours.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [station, metric, local_date]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "station_hours between 18 and 25"
    columns:
      - {name: station, data_type: text, constraints: [{type: not_null}]}
      - {name: model_point, data_type: text}
      - {name: distance_km, data_type: double precision}
      - {name: metric, data_type: text, constraints: [{type: not_null}]}
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: station_mean_ugm3, data_type: double precision}
      - {name: model_mean_ugm3, data_type: double precision}
      - {name: bias_ugm3, data_type: double precision, description: Model minus station (positive = the model overestimates).}
      - {name: station_max_ugm3, data_type: double precision}
      - {name: station_hours, data_type: bigint, description: Valid hours of the station that day.}

  - name: fct_air_quality_monthly
    description: >-
      Monthly mean of each official air quality station and pollutant, from the GOIB history (2002 to June 2021)
      and the EEA (verified files from July 2021, the live feed for the current year), which share the station
      names: one series per station over two decades. A month is
      representative with at least 75 % of its hours valid.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [source, station, metric, month]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coverage between 0 and 1"
    columns:
      - {name: source, data_type: text, constraints: [{type: not_null}]}
      - {name: station, data_type: text, constraints: [{type: not_null}]}
      - {name: metric, data_type: text, constraints: [{type: not_null}]}
      - {name: month, data_type: date, constraints: [{type: not_null}], description: First day of the local month.}
      - {name: mean_ugm3, data_type: double precision}
      - {name: max_ugm3, data_type: double precision, description: Highest hourly value of the month.}
      - {name: valid_hours, data_type: bigint}
      - {name: coverage, data_type: double precision, description: Valid hours over the hours of the month.}
      - {name: is_representative, data_type: boolean, description: At least 75 % of the hours valid.}

  - name: fct_pollen_dust_daily
    description: >-
      Olive and grass pollen, Saharan dust and UV of every Open-Meteo model point per local day (CAMS Europe): daily
      mean and maximum, and the pollen level of the daily mean with the thresholds of the Red Española de
      Aerobiología (vars.pollen_levels). Before November 2023 CAMS served pollen only in its season: days outside it
      have no pollen value.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [point, local_date]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(dust_max_ugm3 >= dust_mean_ugm3, true) and coalesce(olive_pollen_max >= olive_pollen_mean, true)"
    columns:
      - {name: point, data_type: text, constraints: [{type: not_null}]}
      - {name: local_date, data_type: date, constraints: [{type: not_null}]}
      - {name: olive_pollen_mean, data_type: double precision, description: Daily mean of olive pollen (grains/m3).}
      - {name: olive_pollen_max, data_type: double precision, description: Highest hour of the day (grains/m3).}
      - name: olive_pollen_level
        data_type: text
        description: "REA level of the daily mean: none (< 1), low (1-50), moderate (51-200), high (> 200)."
        data_tests:
          - accepted_values:
              arguments: {values: [none, low, moderate, high]}
      - {name: grass_pollen_mean, data_type: double precision, description: Daily mean of grass pollen (grains/m3).}
      - {name: grass_pollen_max, data_type: double precision}
      - name: grass_pollen_level
        data_type: text
        description: "REA level of the daily mean: none (< 1), low (1-25), moderate (26-50), high (> 50)."
        data_tests:
          - accepted_values:
              arguments: {values: [none, low, moderate, high]}
      - {name: dust_mean_ugm3, data_type: double precision, description: Daily mean of dust near the ground (ug/m3).}
      - {name: dust_max_ugm3, data_type: double precision}
      - {name: is_dust_over_threshold, data_type: boolean, description: The point alone reaches dust_episode_ugm3.}
      - {name: uv_index_max, data_type: double precision, description: Highest UV index of the day (since August 2022).}

  - name: fct_dust_episodes
    description: >-
      One row per Saharan dust episode: consecutive days whose mean dust of the model points reaches
      dust_episode_ugm3 (gaps and islands). The PM10 of the official stations (EEA) during the episode is compared,
      station by station, with their PM10 on the days without dust within dust_baseline_half_days of it; the CAMS
      PM10 of the nearest model point on the same days gives the bias of the model the corrections use.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [episode_id]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date >= start_date and peak_day between start_date and end_date"
    columns:
      - {name: episode_id, data_type: text, constraints: [{type: not_null}]}
      - {name: start_date, data_type: date, constraints: [{type: not_null}]}
      - {name: end_date, data_type: date}
      - name: days
        data_type: integer
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 1}
      - {name: peak_day, data_type: date, description: Day with the highest mean dust of the island.}
      - {name: peak_point, data_type: text, description: Model point with the most dust on the peak day.}
      - {name: peak_dust_ugm3, data_type: double precision, description: Highest daily mean of a point (ug/m3).}
      - {name: mean_dust_ugm3, data_type: double precision, description: Mean dust of the island over the episode.}
      - {name: max_hourly_dust_ugm3, data_type: double precision}
      - {name: stations, data_type: integer, description: EEA stations with PM10 both in the episode and around it.}
      - {name: station_pm10_ugm3, data_type: double precision, description: Mean PM10 of those stations in the episode.}
      - {name: baseline_pm10_ugm3, data_type: double precision, description: Their mean PM10 on the days around it without dust.}
      - {name: pm10_excess_ugm3, data_type: double precision, description: How much higher the station PM10 is during the episode.}
      - {name: model_pm10_ugm3, data_type: double precision, description: CAMS PM10 at the nearest model points in the episode.}
      - {name: model_bias_ugm3, data_type: double precision, description: CAMS minus stations in the episode (positive = overestimates).}

  - name: agg_dust_pm10_by_station
    description: >-
      PM10 of each official station (EEA) on Saharan dust days and on the other days, and the bias of the CAMS
      PM10 of its nearest model point on each: what the dust adds at the station and how the model that fills its
      gaps (config/corrections.yaml) errs then.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [station]
    columns:
      - {name: station, data_type: text, constraints: [{type: not_null}]}
      - {name: model_point, data_type: text}
      - {name: dust_days, data_type: integer}
      - {name: other_days, data_type: integer}
      - {name: pm10_dust_days_ugm3, data_type: double precision}
      - {name: pm10_other_days_ugm3, data_type: double precision}
      - {name: pm10_excess_ugm3, data_type: double precision, description: Dust days minus the other days.}
      - {name: model_bias_dust_days_ugm3, data_type: double precision, description: CAMS minus station on dust days.}
      - {name: model_bias_other_days_ugm3, data_type: double precision}
      - {name: first_day, data_type: date}
      - {name: last_day, data_type: date}

  - name: fct_observations_corrected
    description: >-
      Station observations (SOCIB, EEA) with their proposed corrections side by side, from the first correction
      onwards: `original_value`, `corrected_value` and `value` (corrected where there is a correction, original
      elsewhere). An hour without a valid value that could be estimated has `is_corrected`, the method
      (`interpolation` of a short gap or a `support` series), the support and its bias, and a confidence (0-1).
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, entity, metric, ts]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_corrected or (confidence between 0 and 1 and correction_method is not null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "correction_method is distinct from 'support' or support_entity is not null"
    columns:
      - name: original_quality
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "missing", "absent"]
      - name: value
        description: The corrected value where there is one, the original elsewhere (NULL when neither exists).

  - name: dim_sea_temperature_climatology
    description: >
      The usual satellite sea surface temperature of every NOAA OISST coastal point and day of the year (1-366,
      29 February = 60): mean and 90th percentile of the final 1991-2020 values within 5 days of that day, smoothed
      with a 31-day moving mean (Hobday et al., 2016). The reference of the anomaly and of the marine heatwaves.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [point, day_of_year]
    data_tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments: {column_A: sst_p90_c, column_B: sst_climatology_c}
    columns:
      - {name: point, data_type: text, constraints: [{type: not_null}]}
      - name: day_of_year
        data_type: integer
        constraints: [{type: not_null}]
        data_tests:
          - value_between:
              arguments: {min_value: 1, max_value: 366}
      - {name: sst_climatology_c, data_type: "numeric(6,3)"}
      - {name: sst_p90_c, data_type: "numeric(6,3)"}
      - name: baseline_values
        data_type: bigint
        description: Daily values behind the day (30 years x 11 days = 330; fewer on 29 February).

  - name: fct_sea_temperature_daily
    description: >
      Satellite sea surface temperature (NOAA OISST v2.1) per coastal point and day since September 1981: the final
      value or, for the last two weeks, the preliminary one; its anomaly against the 1991-2020 climatology of the
      same day of the year, and the marine heatwaves of Hobday et al. (2016) - 5 or more days in a row above the
      90th percentile, two of them with 2 days or less in between are one - built with gaps and islands.
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, day]
    columns:
      - name: sst_c
        data_tests:
          - value_between:
              arguments: {min_value: 5, max_value: 35}
      - name: sst_anomaly_c
        description: Value minus the climatology of the day (°C).
        data_tests:
          - value_between:
              arguments: {min_value: -10, max_value: 10}
      - name: is_preliminary
        description: True while the final value of the day is not published yet (about 16 days).
        data_tests: [not_null]
      - name: is_marine_heatwave
        data_tests: [not_null]
      - name: heatwave_id
        data_tests:
          - relationships:
              arguments: {to: ref('fct_marine_heatwaves'), field: heatwave_id}

  - name: fct_marine_heatwaves
    description: >
      One row per marine heatwave of a coastal point (Hobday et al., 2016): start, end, days, peak, mean and
      accumulated intensity above the climatology and the category of Hobday et al. (2018) (moderate, strong,
      severe, extreme: the peak in multiples of the gap between the 90th percentile and the climatology).
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [heatwave_id]
    data_tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments: {column_A: end_date, column_B: start_date}
    columns:
      - {name: heatwave_id, data_type: text, constraints: [{type: not_null}]}
      - {name: point, data_type: text}
      - {name: start_date, data_type: date}
      - {name: end_date, data_type: date}
      - name: days
        data_type: integer
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 5}
      - {name: peak_day, data_type: date}
      - {name: peak_sst_c, data_type: "numeric(5,2)"}
      - {name: max_intensity_c, data_type: "numeric(5,2)", description: Highest anomaly of the heatwave (°C).}
      - {name: mean_intensity_c, data_type: "numeric(5,2)"}
      - {name: cumulative_intensity_c_days, data_type: "numeric(7,1)", description: Sum of the daily anomalies.}
      - name: category
        data_type: text
        data_tests:
          - accepted_values:
              arguments: {values: [moderate, strong, severe, extreme]}
      - {name: has_preliminary_days, data_type: boolean}

  - name: fct_sea_temperature_monthly
    description: >
      The sea around Mallorca per month from the satellite: mean surface temperature of the coastal points, its
      anomaly against the 1991-2020 climatology of the same days, the marine heatwave days (mean of the points) and
      the days with a heatwave at any point. Next to fct_climate_monthly on the climate page.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [month]
    columns:
      - {name: month, data_type: date, constraints: [{type: not_null}]}
      - {name: points, data_type: bigint}
      - {name: days_reported, data_type: bigint}
      - {name: sst_mean_c, data_type: "numeric(5,2)"}
      - {name: sst_climatology_c, data_type: "numeric(5,2)"}
      - {name: sst_anomaly_c, data_type: "numeric(5,2)"}
      - name: heatwave_days
        data_type: "numeric(4,1)"
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 31}
      - {name: days_with_heatwave, data_type: bigint}
      - {name: has_preliminary_days, data_type: boolean}

  - name: fct_sst_model_comparison_daily
    description: >
      Satellite vs model per coastal point and UTC day: the OISST sea surface temperature and the daily mean of the
      hourly one of Open-Meteo Marine at the same point, and the difference (model minus satellite). A model day
      needs 20 hours.
    data_tests:
      - unique_combination:
          arguments:
            columns: [point, day]
    columns:
      - name: sst_bias_c
        data_tests:
          - value_between:
              arguments: {min_value: -10, max_value: 10}

  - name: agg_sst_model_bias_by_point
    description: >-
      Sea temperature model quality per coastal point against the satellite: bias, MAE, RMSE and correlation of
      the daily values, the mean of each side and the days compared.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [point]
    columns:
      - {name: point, data_type: text, constraints: [{type: not_null}]}
      - {name: days_compared, data_type: bigint}
      - {name: sst_satellite_mean_c, data_type: "numeric(5,2)"}
      - {name: sst_model_mean_c, data_type: "numeric(5,2)"}
      - {name: sst_bias_c, data_type: "numeric(5,2)", description: Mean of model minus satellite.}
      - name: sst_mae_c
        data_type: "numeric(5,2)"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments: {min_value: 0}
      - {name: sst_rmse_c, data_type: "numeric(5,2)"}
      - {name: sst_correlation, data_type: "numeric(4,3)"}
      - {name: first_day, data_type: date}
      - {name: last_day, data_type: date}

unit_tests:
  - name: anomaly_benchmark_latest_run_per_source
    description: >-
      Each source keeps its own newest run: a later run that left a source out does not make the older run of
      that source stale.
    model: fct_anomaly_evaluations
    given:
      - input: ref('stg_quality__anomaly_evaluations')
        rows:
          - {run_id: r1, source: socib, detector: vote, fault: all, evaluated_at: "2026-11-01 10:00:00+00"}
          - {run_id: r1, source: open_meteo, detector: vote, fault: all, evaluated_at: "2026-11-01 10:00:00+00"}
          - {run_id: r2, source: open_meteo, detector: vote, fault: all, evaluated_at: "2026-11-20 10:00:00+00"}
    expect:
      rows:
        - {run_id: r1, source: socib, is_latest: true}
        - {run_id: r1, source: open_meteo, is_latest: false}
        - {run_id: r2, source: open_meteo, is_latest: true}

  - name: eaqi_band_is_the_worst_pollutant
    description: The European AQI band of an hour is the worst band among PM2.5, PM10, NO2 and O3.
    model: air_quality_hourly
    given:
      - input: ref('fct_observations')
        rows:
          - {source: open_meteo, entity: palma, ts: "2026-10-23 10:00:00+00", metric: pm2_5, value: 12, is_suspect: false}
          - {source: open_meteo, entity: palma, ts: "2026-10-23 10:00:00+00", metric: pm10, value: 55, is_suspect: false}
          - {source: open_meteo, entity: palma, ts: "2026-10-23 10:00:00+00", metric: nitrogen_dioxide, value: 30, is_suspect: false}
          - {source: open_meteo, entity: palma, ts: "2026-10-23 10:00:00+00", metric: ozone, value: 60, is_suspect: false}
          - {source: open_meteo, entity: inca, ts: "2026-10-23 10:00:00+00", metric: pm2_5, value: 5, is_suspect: false}
    expect:
      rows:
        - {entity: palma, eaqi_band: 4, eaqi_label: poor}  # PM10 at 55 ug/m3 sets the band
        - {entity: inca, eaqi_band: 1, eaqi_label: good}

  - name: earthquake_distance_and_latest_revision
    description: Haversine distance to Palma, and a revised event keeps only its latest origin time.
    model: fct_earthquakes
    given:
      - input: ref('stg_ign__observations')
        rows:
          - {source: ign, entity: ev_palma, metric: magnitude, ts: "2026-10-01 10:00:00+00", local_date: "2026-10-01", value: 2.0, lat: 39.5696, lon: 2.6502, quality: ok, quality_reasons: null, is_missing: false, is_suspect: false, ingested_at: "2026-10-02 00:00:00+00"}
          - {source: ign, entity: ev_north, metric: magnitude, ts: "2026-10-01 11:00:00+00", local_date: "2026-10-01", value: 1.5, lat: 40.5696, lon: 2.6502, quality: ok, quality_reasons: null, is_missing: false, is_suspect: false, ingested_at: "2026-10-02 00:00:00+00"}
          - {source: ign, entity: ev_north, metric: magnitude, ts: "2026-10-01 11:00:05+00", local_date: "2026-10-01", value: 1.6, lat: 40.5696, lon: 2.6502, quality: ok, quality_reasons: null, is_missing: false, is_suspect: false, ingested_at: "2026-10-03 00:00:00+00"}
    expect:
      rows:
        - {event_id: ev_palma, magnitude: 2.0, distance_to_palma_km: 0.0}
        - {event_id: ev_north, magnitude: 1.6, distance_to_palma_km: 111.2}  # 1 degree of latitude; the revision wins

  - name: consecutive_episode_days_form_one_episode
    description: Gaps and islands - days 19, 20 and 22 October give two episodes; the calm day 21 splits them.
    model: fct_weather_episodes
    given:
      - input: ref('int_weather_extremes__daily')
        rows:
          - {local_date: "2026-10-19", max_rain_mm: 79.2, max_rain_station: B158X, stations_over_rain_threshold: 9, max_gust_kmh: 87.1, max_wave_m: 2.6, is_heavy_rain: true, is_strong_wind: true, is_rough_sea: true}
          - {local_date: "2026-10-20", max_rain_mm: 12.0, max_rain_station: B278, stations_over_rain_threshold: 0, max_gust_kmh: 75.0, max_wave_m: 1.9, is_heavy_rain: false, is_strong_wind: true, is_rough_sea: false}
