  - name: bathing_water_class_follows_the_directive_percentiles
    description: >-
      16 clean samples make an excellent water; 16 samples of 1,000 E. coli across two points a poor one (its 90th
      percentile is 1,000), and with a ban of 5 days; three samples are too few to classify.
    model: fct_bathing_water_seasons
    given:
      - input: ref('stg_nayade__observations')
        format: sql
        rows: |
          select 'nayade' as source, '07042_1001_PM1' as entity, m as metric, d::date as local_date,
                 10.0::double precision as value, false as is_missing, 39.9 as lat, 3.05 as lon
          from generate_series('2026-05-01'::date, '2026-05-16', interval '1 day') as d
          cross join unnest(array['e_coli', 'enterococci']) as m
          union all
          select 'nayade', '07042_1002_' || p, m, d::date, case m when 'e_coli' then 1000.0 else 300.0 end,
                 false, 39.9, 3.06
          from generate_series('2025-06-01'::date, '2025-06-08', interval '1 day') as d
          cross join unnest(array['e_coli', 'enterococci']) as m
          cross join unnest(array['PM1', 'PM2']) as p
          union all
          select 'nayade', '07042_1002_PM1', 'incident_level', '2025-06-03'::date, 2.0, false, 39.9, 3.06
          union all
          select 'nayade', '07042_1002_PM1', 'incident_days', '2025-06-03'::date, 5.0, false, 39.9, 3.06
          union all
          select 'nayade', '07042_1003_PM1', m, d::date, 50.0, false, 39.95, 3.1
          from generate_series('2026-07-01'::date, '2026-07-03', interval '1 day') as d
          cross join unnest(array['e_coli', 'enterococci']) as m
      - input: ref('stg_silver__entities')
        rows:
          - {source: nayade, entity: 07042_1001_PM1, name: Playa Uno}
          - {source: nayade, entity: 07042_1002_PM1, name: Playa Dos (PM1)}
          - {source: nayade, entity: 07042_1002_PM2, name: Playa Dos (PM2)}
          - {source: nayade, entity: 07042_1003_PM1, name: Playa Tres}
      - input: ref('dim_municipalities')
        rows:
          - {municipality: "07042", name: Pollença}
    expect:
      rows:
        - {bathing_water: "1001", name: Playa Uno, municipality_name: Pollença, season: 2026, sampling_points: 1, samples: 16, assessed_samples: 16, bans: 0, quality_class: 4, quality: excellent}
        - {bathing_water: "1002", name: Playa Dos, municipality_name: Pollença, season: 2025, sampling_points: 2, samples: 16, assessed_samples: 16, bans: 1, quality_class: 1, quality: poor}
        - {bathing_water: "1003", name: Playa Tres, municipality_name: Pollença, season: 2026, sampling_points: 1, samples: 3, assessed_samples: 3, bans: 0, quality_class: null, quality: null}

  - name: bathing_water_island_share_counts_classified_only
    description: A water without a class counts among the bathing waters but not in the share of excellent ones.
