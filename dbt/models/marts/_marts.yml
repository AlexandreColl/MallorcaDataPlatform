  - name: climate_month_needs_a_complete_station
    description: A station with fewer than 90 % of its days does not count, so a missing week is not a dry month.
    model: fct_climate_monthly
    given:
      - input: ref('int_weather__daily')
        format: sql
        rows: |
          select 'aemet' as source, 'B278' as entity, d::date as local_date, 20.0 as temperature_mean,
                 25.0 as temperature_max, 2.0 as precipitation_sum
          from generate_series('2025-09-01'::date, '2025-09-30', interval '1 day') as d
          union all
          select 'aemet', 'B013', d::date, 15.0, 31.0, 10.0
          from generate_series('2025-09-01'::date, '2025-09-20', interval '1 day') as d
    expect:
      rows:
        - {month: "2025-09-01", hydrological_year: 2026, rain_stations: 1, rain_mm: 60.0, wet_days: 30.0, hot_days: 0.0, rain_anomaly: 0.000}

  - name: model_bias_is_compared_at_the_height_of_the_station
    description: >-
      A station 500 m above its model cell is 3.25 °C colder for the altitude alone: the adjusted bias removes it.
      Without the heights the adjustment is 0.
    model: fct_model_bias_daily
    given:
      - input: ref('int_station_model_pairs')
        rows:
          - {station_source: aemet, station: B013X, model_point: inca, distance_km: 12.0, elevation_diff_m: 500.0}
          - {station_source: socib, station: parcbit, model_point: palma, distance_km: 5.0, elevation_diff_m: null}
      - input: ref('fct_weather_daily')
        rows:
          - {source: aemet, entity: B013X, local_date: "2026-11-01", is_complete_day: true, temperature_mean: 12.0, temperature_max: 16.0, temperature_min: 8.0}
          - {source: socib, entity: parcbit, local_date: "2026-11-01", is_complete_day: true, temperature_mean: 16.0, temperature_max: 20.0, temperature_min: 12.0}
          - {source: open_meteo, entity: inca, local_date: "2026-11-01", is_complete_day: true, temperature_mean: 14.5, temperature_max: 18.5, temperature_min: 10.5}
          - {source: open_meteo, entity: palma, local_date: "2026-11-01", is_complete_day: true, temperature_mean: 17.0, temperature_max: 21.0, temperature_min: 13.0}
    expect:
      rows:
        - {station: B013X, altitude_adjustment_c: -3.25, temperature_mean_bias: 2.5, temperature_mean_bias_adjusted: -0.75, temperature_max_bias_adjusted: -0.75}
        - {station: parcbit, altitude_adjustment_c: 0.0, temperature_mean_bias: 1.0, temperature_mean_bias_adjusted: 1.0, temperature_max_bias_adjusted: 1.0}

