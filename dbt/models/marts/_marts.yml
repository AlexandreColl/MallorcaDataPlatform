        rows:
          - {entity: palma, local_date: "2026-05-01", metric: olive_pollen, value: 60, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-01", metric: olive_pollen, value: 0, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-01", metric: grass_pollen, value: 40, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-02", metric: olive_pollen, value: 250, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-02", metric: grass_pollen, value: 0.4, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-02", metric: dust, value: 30, is_missing: false, is_suspect: false}
          - {entity: palma, local_date: "2026-05-02", metric: dust, value: 9999, is_missing: false, is_suspect: true}
    expect:
      rows:
