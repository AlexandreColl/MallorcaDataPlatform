name: mallorca
version: "0.20.2"
config-version: 2
profile: mallorca

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
# Packages live outside the project in the image (the project is mounted read-only): see the Dockerfile.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets: ["target", "dbt_packages"]

vars:
  local_timezone: Europe/Madrid   # local day used by every daily model
  incremental_lookback: 1 hour     # re-read rows changed just before the last build (commit races)
  date_spine_start: "1996-01-01"  # first day of dim_date: the oldest data (INE municipal register)
  palma: {lat: 39.5696, lon: 2.6502}  # reference point for distances
  # station vs model: an observation station is compared with the nearest model point within this distance
  model_pairing_max_km: 25
  # the air cools ~6.5 °C per km up: the model is compared at the height of the station (see fct_model_bias_daily)
  lapse_rate_c_per_km: 6.5
  # weather episodes: a day is an episode day when any threshold is reached somewhere on the island
  episode_rain_mm: 30
  episode_gust_kmh: 70
  episode_wave_m: 2.5
  # sea temperature (NOAA OISST): the climatology of every day of the year, as in Hobday et al. (2016) — the
  # 30-year baseline, the values within 5 days of that day in every year (an 11-day window), then a 31-day moving
  # mean. A marine heatwave is at least 5 days in a row above the 90th percentile; two separated by 2 days or less
  # are one.
  sst_baseline: {start: "1991-01-01", end: "2020-12-31"}
  sst_window_half_days: 5
  sst_smoothing_half_days: 15
  sst_heatwave_percentile: 0.9
  sst_heatwave_min_days: 5
  sst_heatwave_max_gap_days: 2
  # Connectors whose rows are events (see macros/event_sources.sql). ine_tourist_housing is `frequency: event` only
  # because its reference months are irregular: its rows are series of a municipality, so it is not listed here.
  event_sources: ["ign", "aemet_warnings"]

seeds:
  mallorca:
    +schema: gold

models:
  mallorca:
    # staging: one light model per source table (rename, types, local day). Views: always current, no storage.
    staging:
      +materialized: view
      +schema: dbt_staging
    # intermediate: reusable joins and pivots that several marts build on. Views, not exposed to users.
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    # marts: what Grafana and analysts read, grouped by domain. Tables (the big facts are incremental).
    marts:
      +materialized: table
      +schema: gold
