<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mallorca en datos: turismo, agua, clima, movilidad y energía de doce fuentes abiertas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mallorca en datos</title>
    <script>
      // Apply the saved theme (or the system's) before the first paint, so the page never flashes the wrong one.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("mdp-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
